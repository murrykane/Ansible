---
- name: Ensure Loki/promtail/grafana setup for Docker is setup and configured
  #hosts: minidocker.kane.mk
  hosts: docker
  become: yes

  tasks:

    # - name: Make sure Docker is present
    #   ansible.builtin.package:
    #     name: docker
    #     state: present

    # - name: Enable and start docker service
    #   ansible.builtin.service:
    #     name: docker
    #     enabled: yes
    #     state: started

    # - name: Find Loki container by docker ps
    #   shell: | 
    #     {% raw %}
    #     docker ps --format '{{.Names}}' | grep -i loki | head -n 1
    #     {% endraw %}
    #   register: loki_container
    #   ignore_errors: yes
    #   changed_when: false

    - name: Find Promtail container by docker ps
      shell: | 
        {% raw %}
        docker ps --format '{{.Names}}' | grep -i promtail | head -n 1
        {% endraw %}
      register: loki_container
      ignore_errors: yes
      changed_when: false

    - name: Ouptut for Loki container
      ansible.builtin.debug:
        var: loki_container 
      when: loki_container is defined 

    - name: Check if Loki plugin is installed
      shell: docker plugin ls
      register: loki_plugins
      when: 
        - loki_container is defined 
        - loki_container.stdout != ""
      changed_when: false
      ignore_errors: yes

    - name: Ouptut for Loki container
      ansible.builtin.debug:
        var: loki_plugins
      when: loki_plugins is defined 

    # docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
    - name: Install Grafana Loki plugin
      #shell: docker exec {{ loki_container.stdout }} grafana-cli plugins install grafana-loki-datasource
      shell: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
      when:
        - loki_container is defined 
        - loki_container.stdout != ""
        - "'loki' not in loki_plugins.stdout"

    - name: Configure docker to forward logs to Loki
      ansible.builtin.template:
        src: docker-daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      notify: Restart docker
      when: 
        - loki_container is defined 
        - "'docker' in group_names"
        - loki_container.stdout != ""

    # - name: Install Grafana Loki plugin (if Grafana container exists)
    #   shell: docker exec grafana grafana-cli plugins install grafana-loki-datasource
    #   ignore_errors: yes


  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted