---
- name: Ensure Loki/promtail/grafana setup for Docker is setup and configured
  hosts: minidocker.kane.mk
  become: yes

  tasks:

    # - name: Make sure Docker is present
    #   ansible.builtin.package:
    #     name: docker
    #     state: present

    # - name: Enable and start docker service
    #   ansible.builtin.service:
    #     name: docker
    #     enabled: yes
    #     state: started

    - name: List all Docker containers
      community.docker.docker_container_ls:
        all: true
      register: all_containers
      ignore_errors: yes

    - name: Find first container with 'loki' in its name
      set_fact:
        loki_container: "{{ item.Names[0] }}"
      loop: "{{ all_containers.containers }}"
      when: "'loki' in item.Names[0]"
      register: loki_container_found
      ignore_errors: yes

    - name: Check if Loki plugin is already installed
      shell: docker exec {{ loki_container | regex_replace('^/', '') }} grafana-cli plugins ls
      register: loki_plugins
      when: loki_container_found is defined and loki_container is defined
      changed_when: false
      ignore_errors: yes

    - name: Install Grafana Loki plugin
      shell: docker exec {{ loki_container | regex_replace('^/', '') }} grafana-cli plugins install grafana-loki-datasource
      when:
        - loki_container_found is defined
        - loki_container is defined
        - "'grafana-loki-datasource' not in loki_plugins.stdout"


    - name: Configure docker to forward logs to Loki
      ansible.builtin.template:
        src: docker-daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      notify: Restart docker
      when: "'docker' in group_names"

    # - name: Install Grafana Loki plugin (if Grafana container exists)
    #   shell: docker exec grafana grafana-cli plugins install grafana-loki-datasource
    #   ignore_errors: yes


  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted