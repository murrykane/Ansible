---
- name: Install core packages for virtual machines
  #hosts: "{{ my_hosts | d([]) }}"
  hosts: "{{ scriptinventory }}"
  become: true

  vars:
    users: 
      - semaphore
      - murry

  tasks:

    - name: Install packages
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - nfs-common
          - qemu-guest-agent
        update_cache: true

    # - name: Start guest qemu-guest-agent
    #   ansible.builtin.service:
    #     name: qemu-guest-agent
    #     state: started
    #     enabled: true

    - name: Create group
      group:
        name: "sudo"
        state: present

    - name: Create users
      user:
        name: "{{ item }}"
        create_home: true
        append: true
        state: present
        generate_ssh_key: true
        shell: /bin/bash
        groups: admin, sudo
      loop: "{{ users }}"

    - name: Read shared public key from files/id_rsa.pub
      delegate_to: localhost
      become: false
      slurp:
        src: "files/semaphore_id.pub"
      register: pubkey_contents

    - name: Ensure .ssh directory exists for each user
      file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0700'
      loop: "{{ users }}"

    - name: Append shared public key to authorized_keys if not present
      ansible.builtin.lineinfile:
        path: "/home/{{ item }}/.ssh/authorized_keys"
        line: "{{ pubkey_contents.content | b64decode | trim }}"
        create: yes
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0600'
      loop: "{{ users }}"



