- name: Install core packages for virtual machines
  hosts: "{{ scriptinventory }}"
  become: true
  gather_facts: true
  vars:
    users:
      - semaphore
      - murry
  tasks:

    - name: Install packages
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - nfs-common
          - qemu-guest-agent
          - tree
          - net-tools
          - jq
          #- ufw                 #does not work on LXC containers
          - openssh-server
        update_cache: true

    - name: Ensure SSH service is running and enabled
      systemd:
        name: ssh
        state: started
        enabled: yes

    - name: Check status of SSH service
      command: systemctl status ssh
      register: ssh_status
      changed_when: false

    - name: Print SSH service status
      debug:
        var: ssh_status.stdout_lines

    # - name: Allow SSH through UFW
    #   ufw:
    #     rule: allow
    #     name: OpenSSH

    # - name: Allow Docker TCP access from 192.168.1.0/24 on port 2376
    #   command: >
    #     ufw allow from 192.168.1.0/24 to any port 2376 proto tcp
    #   args:
    #     warn: false

    # - name: Ensure UFW is enabled
    #   ufw:
    #     state: enabled

    # - name: Reload UFW
    #   command: ufw reload        

    - name: Create group
      group:
        name: "sudo"
        state: present

    - name: Create users
      user:
        name: "{{ item }}"
        create_home: true
        append: true
        state: present
        generate_ssh_key: true
        shell: /bin/bash
        groups: admin, sudo
      loop: "{{ users }}"

    - name: Ensure .ssh directory exists for each user
      file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0700'
      loop: "{{ users }}"

    - name: copy public key for accounts
      ansible.builtin.copy:
        src: files/{{ item }}_id.pub
        dest: /home/{{ item }}/.ssh/{{ item }}_id.pub
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0600'
      loop: "{{ users }}"

    - name: Read shared public key from PUB
      slurp:
        src: "/home/semaphore/.ssh/semaphore_id.pub"
      register: pubkey_contents

    - name: Append shared public key to authorized_keys
      ansible.builtin.lineinfile:
        path: "/home/{{ item }}/.ssh/authorized_keys"
        line: "{{ pubkey_contents.content | b64decode | trim }}"
        create: yes
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0600'
      loop: "{{ users }}"

    - name: Create sudoers file for no password 
      ansible.builtin.file:
        path: /etc/sudoers.d/90-kane-init
        state: touch
        mode: '0660'
        owner: root
        group: root

    - name: Append shared public key to sudoers allowed list
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/90-kane-init
        line: "{{ item }} ALL=(ALL) NOPASSWD:ALL"
      loop: "{{ users }}"



