---
- name: Install core packages for virtual machines
  hosts: "{{ scriptinventory }}"
  become: true
  gather_facts: true
  vars:
    # users:
    #   - semaphore
    #   - murry

    usersWithIDs:
      - name: semaphore
        uid: 1001
        gid: 1001
      - name: murry
        uid: 1000
        gid: 1000


  tasks:

    - name: Install packages
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - nfs-common
          - qemu-guest-agent
          - tree
          - net-tools
          - jq
          #- ufw                 #does not work on LXC containers
          - openssh-server
          - apache2-utils
          - tree
          - net-tools
        update_cache: true

    - name: Ensure SSH service is running and enabled
      systemd:
        name: ssh
        state: started
        enabled: yes

    - name: Check status of SSH service
      command: systemctl status ssh
      register: ssh_status
      changed_when: false

    - name: Print SSH service status
      debug:
        var: ssh_status.stdout_lines

    # - name: Allow SSH through UFW
    #   ufw:
    #     rule: allow
    #     name: OpenSSH

    # - name: Allow Docker TCP access from 192.168.1.0/24 on port 2376
    #   command: >
    #     ufw allow from 192.168.1.0/24 to any port 2376 proto tcp
    #   args:
    #     warn: false

    # - name: Ensure UFW is enabled
    #   ufw:
    #     state: enabled

    # - name: Reload UFW
    #   command: ufw reload        

    - name: Create group sudo
      group:
        name: "sudo"
        state: present

    - name: Create group admin
      group:
        name: "admin"
        state: present

    # new logic for create users....
    - name: "Create user groups with fixed GIDs"
      group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        state: present
      loop: "{{ usersWithIDs }}"

    - name: "Create users with fixed UID/GID"
      user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        group: "{{ item.name }}"
        groups: "admin,sudo"
        append: true
        create_home: true
        shell: /bin/bash
        state: present
        generate_ssh_key: true
      loop: "{{ usersWithIDs }}"

    - name: Ensure .ssh directory exists for each user
      file:
        path: "/home/{{ item.name }}/.ssh"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: '0700'
      loop: "{{ usersWithIDs }}"

    - name: Copy public key for each account
      copy:
        src: "files/{{ item.name }}_id.pub"
        dest: "/home/{{ item.name }}/.ssh/{{ item.name }}_id.pub"
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: '0600'
      loop: "{{ usersWithIDs }}"

    - name: Read semaphore public key
      slurp:
        src: "/home/semaphore/.ssh/semaphore_id.pub"
      register: pubkey_contents

    - name: Append semaphore shared key to each authorized_keys
      lineinfile:
        path: "/home/{{ item.name }}/.ssh/authorized_keys"
        line: "{{ pubkey_contents.content | b64decode | trim }}"
        create: yes
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: '0600'
      loop: "{{ usersWithIDs }}"

    - name: Create sudoers file for no password 
      ansible.builtin.file:
        path: /etc/sudoers.d/90-kane-init
        state: touch
        mode: '0660'
        owner: root
        group: root

    - name: Append shared public key to sudoers allowed list
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/90-kane-init
        line: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL"
      loop: "{{ usersWithIDs }}"

