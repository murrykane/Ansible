---
- name: Install core packages for virtual machines
  #hosts: "{{ my_hosts | d([]) }}"
  hosts: "{{ scriptinventory }}"
  become: true

  vars:
    username: semaphore

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - nfs-common
          - qemu-guest-agent
        update_cache: true

    # - name: Start guest qemu-guest-agent
    #   ansible.builtin.service:
    #     name: qemu-guest-agent
    #     state: started
    #     enabled: true

    - name: Create group
      group:
        name: "sudo"
        state: present

    - name: Create Users Task
      user:
        name: "{{ item }}"
        create_home: true
        append: true
        state: present
        generate_ssh_key: true
        shell: /bin/bash
        groups: admin, sudo
      loop:
        - semaphore
        - murry


    - name: Ensure .ssh directory exists for user
      file:
        path: "/home/{{ username }}/.ssh"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0700'

    - name: Read public key from local file
      delegate_to: localhost
      become: false
      slurp:
        src: "/home/{{ username }}/.ssh/id_rsa.pub"
      register: pubkey_contents

    - name: Set authorized_keys with public key
      copy:
        content: "{{ pubkey_contents.content | b64decode }}"
        dest: "/home/{{ username }}/.ssh/authorized_keys"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0600'


