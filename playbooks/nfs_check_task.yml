- name: Check if {{ mount_point }} is in /etc/fstab
  ansible.builtin.command: grep -w "{{ mount_point }}" /etc/fstab
  register: fstab_check
  failed_when: false
  changed_when: false

# ---------- Initial mount check ----------
- name: Check if {{ mount_point }} is mounted
  ansible.builtin.command: mountpoint -q {{ mount_point }}
  register: mount_check
  failed_when: false
  changed_when: false
  when: fstab_check.rc == 0

- name: Run tree -L 1 on {{ mount_point }}
  ansible.builtin.command: tree -L 1 {{ mount_point }}
  register: tree_output
  failed_when: false
  changed_when: false
  when:
    - mount_check is defined
    - mount_check.rc == 0

# ---------- Detect broken mount ----------
- name: Send Discord alert for mount issue {{ mount_point }}
  community.general.discord:
    webhook_id: "{{ discord_webhook_id }}"
    webhook_token: "{{ discord_webhook_token }}"
    username: "{{ discord_user }}"
    avatar_url: "{{ discord_avatar }}"
    content: >
      :warning: NFS Share issue on {{ inventory_hostname }} for
      `{{ mount_point }}` - either not mounted or appears empty.
  when:
    - fstab_check.rc == 0
    - mount_check is not defined
      or mount_check.rc != 0
      or (
        tree_output is defined
        and
        (
          tree_output.stdout_lines
          | select('search', '^\\d+ directories?, \\d+ files?$')
          | list
          | length
        ) == 0
      )

# ---------- Repair block ----------
- name: Attempt repair of {{ mount_point }}
  block:

    - name: Unmount {{ mount_point }}
      ansible.builtin.command: umount {{ mount_point }}
      ignore_errors: true

    - name: Remount all fstab entries
      ansible.builtin.command: mount -a

    - name: Re-check mount {{ mount_point }}
      ansible.builtin.command: mountpoint -q {{ mount_point }}
      register: remount_check
      failed_when: false
      changed_when: false

    - name: Re-run tree after remount
      ansible.builtin.command: tree -L 1 {{ mount_point }}
      register: retried_tree_output
      failed_when: false
      changed_when: false
      when:
        - remount_check.rc == 0

    - name: Alert if remount failed
      community.general.discord:
        webhook_id: "{{ discord_webhook_id }}"
        webhook_token: "{{ discord_webhook_token }}"
        username: "{{ discord_user }}"
        avatar_url: "{{ discord_avatar }}"
        content: >
          :x: Auto-remount failed on {{ inventory_hostname }} for
          `{{ mount_point }}`. Manual intervention required.
      when:
        - remount_check.rc != 0
          or (
            retried_tree_output is defined
            and
            (
              retried_tree_output.stdout_lines
              | select('search', '^\\d+ directories?, \\d+ files?$')
              | list
              | length
            ) == 0
          )

    - name: Alert if remount succeeded
      community.general.discord:
        webhook_id: "{{ discord_webhook_id }}"
        webhook_token: "{{ discord_webhook_token }}"
        username: "{{ discord_user }}"
        avatar_url: "{{ discord_avatar }}"
        content: >
          :heavy_check_mark: Auto-remount worked on {{ inventory_hostname }}
          for `{{ mount_point }}`.
      when:
        - remount_check.rc == 0
        - retried_tree_output is defined
        - (
            retried_tree_output.stdout_lines
            | select('search', '^\\d+ directories?, \\d+ files?$')
            | list
            | length
          ) > 0

  when:
    - fstab_check.rc == 0
    - mount_check is not defined or mount_check.rc != 0
