---
- hosts: mkserver.kane.mk
  become: yes
  vars:
    container_home: '/home/murry/containers/'
    start_order:
      - "portainer"
      - "unifi"
      - "speedtest-tracker"
      - "homepage"
      - "node_exporter"
      - "flask"
      - "orbital-sync"
      - "cadvisor"
      - "unbound"
      - "traefik"
      - "grafana-monitoring"
      - "kuma"

    stop_order:
      - "kuma"
      - "grafana-monitoring"
      - "unifi"
      - "speedtest-tracker"
      - "homepage"
      - "node_exporter"
      - "flask"
      - "orbital-sync"
      - "cadvisor"
      - "unbound"
      - "traefik"
      - "portainer"    

  tasks:

  - name: Iterate over Docker Compose directories
    ansible.builtin.find:
      paths: "{{ container_home }}"
      file_type: directory
    register: compose_dirs


  - name: Check PS status of all Containers
    command:
      cmd: docker-compose ps
    args:
      chdir: "{{container_home}}{{item}}"
    loop: "{{stop_order}}"

  - name: Stop all Containers
    command:
      cmd: docker-compose stop
    args:
      chdir: "{{container_home}}{{item}}"
    loop: "{{stop_order}}"

  - name: Pull all Containers
    command:
      cmd: docker-compose pull
    args:
      chdir: "{{container_home}}{{item}}"
    loop: "{{stop_order}}"

  - name: Start all Containers
    command:
      cmd: docker-compose up -d
    args:
      chdir: "{{container_home}}{{item}}"
    loop: "{{start_order}}"
