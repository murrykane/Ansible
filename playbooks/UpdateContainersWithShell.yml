  #     project_src: "{{container_home}}{{item}}"
  #     state: present
  #     stopped: true
  #     timeout: 200
  #   loop: "{{ stop_order }}"

  # - name: Down all the containers (docker-compose down)
  #   docker_compose:
  #     project_src: "{{container_home}}{{item}}"
  #     state: absent
  #     timeout: 200
  #   loop: "{{ stop_order }}"

  # - name: Update containers to latest version
  #   docker_compose:
  #     project_src: "{{container_home}}{{item}}"
  #     pull: true
  #     recreate: always
  #     restarted: false
  #     debug: true  
  #     timeout: 200
  #   loop: "{{ stop_order }}"

  # - name: Start all Containers
  #   docker_compose:
  #     project_src: "{{container_home}}{{item}}"
  #     state: present
  #     timeout: 200
  #     #restarted: true
  #   loop: "{{ start_order }}"

