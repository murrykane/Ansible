---
- hosts: mkserver.kane.mk
  become: yes
  vars:
    container_home: '/home/murry/containers/'
    start_order:
      - "portainer"
      - "unifi"
      - "speedtest-tracker"
      - "homepage"
      - "node_exporter"
      - "flask"
      - "orbital-sync"
      - "cadvisor"
      - "unbound"
      - "traefik"
      - "grafana-monitoring"
      - "kuma"

    stop_order:
      - "kuma"
      - "grafana-monitoring"
      - "unifi"
      - "speedtest-tracker"
      - "homepage"
      - "node_exporter"
      - "flask"
      - "orbital-sync"
      - "cadvisor"
      - "unbound"
      - "traefik"
      - "portainer"    

  tasks:

  - name: Iterate over Docker Compose directories
    ansible.builtin.find:
      paths: "{{ container_home }}"
      file_type: directory
    register: compose_dirs

  # - name: stop containers hard with force kill
  #   docker_container:
  #     force_kill: true
  #     state: stopped
  #     name: "{{item}}"
  #     timeout: 100
  #   ignore_errors: true
  #   loop: "{{ stop_order }}"

  # - name: Stop all Containers
  #   docker_compose:
  #     project_src: "{{container_home}}{{item}}"
  #     state: present
  #     stopped: true
  #     timeout: 100
  #   loop: "{{ stop_order }}"
  #   ignore_errors: true

  - name: Down all the containers (docker-compose down)
    docker_compose:
      project_src: "{{container_home}}{{item}}"
      state: absent
      timeout: 30
    loop: "{{ stop_order }}"
    ignore_errors: true


  - name: restart docker
    service:
      name: docker
      state: restarted
      enabled: yes


  - name: Update containers to latest version
    docker_compose:
      project_src: "{{container_home}}{{item}}"
      pull: true
      recreate: always
      restarted: false
      debug: true  
      timeout: 100
    loop: "{{ stop_order }}"

  - name: Start all Containers
    docker_compose:
      project_src: "{{container_home}}{{item}}"
      state: present
      timeout: 100
      #restarted: true
    loop: "{{ start_order }}"
    ignore_errors: true

  - name: Start any leftover/missed containers
    docker_compose:
      project_src: "{{ item.path }}"
      state: present
      timeout: 100
    loop: "{{ compose_dirs.files }}"
