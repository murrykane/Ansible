---
#- hosts: docker:qnap
- hosts: docker
  become: yes
  vars:
    docker_bin: "{{ '/share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker' if inventory_hostname in groups['qnap'] else 'docker' }}"
  tasks:
  - name: Start all containers for Docker
    block:

      - name: Get stopped containers
        shell: "{{ docker_bin }} ps -aq --filter status=exited --filter status=created"
        register: stopped_containers
        changed_when: false

      - name: Get containers opted out of self-healing
        shell: "{{ docker_bin }} ps -aq --filter label=selfheal.skip=true"
        register: skip_containers
        changed_when: false

      - name: Start containers
        docker_container:
          name: "{{ item }}"
          state: started
          comparisons:
            '*': ignore
        loop: "{{ stopped_containers.stdout_lines | difference(skip_containers.stdout_lines) }}"
