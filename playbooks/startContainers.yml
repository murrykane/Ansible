---
#- hosts: docker:qnap
- hosts: docker
  become: yes
  tasks:
  - name: Start all containers for Docker
    block:

      - name: Get list of all containers (qnap)
        shell: /share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker ps -aq
        register: container_list_qnap
        when: inventory_hostname in groups['qnap']

      - name: Get list of all containers (linux)
        shell: docker ps -aq
        register: container_list_linux
        when: inventory_hostname not in groups['qnap']

      - name: Start containers
        docker_container:
          name: "{{ item }}"
          state: started
          comparisons:
            '*': ignore
        loop: "{{ (container_list_qnap.stdout_lines if inventory_hostname in groups['qnap'] else container_list_linux.stdout_lines) }}"
        