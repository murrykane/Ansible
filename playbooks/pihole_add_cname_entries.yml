- name: Add CNAME records to Pi-hole idempotently
  hosts: localhost
  gather_facts: no
  vars_files:
    - vars/pihole_cname.yml

  tasks:     

    - name: Normalize pihole_cname_entries (lowercase domains)
      set_fact:
        pihole_cname_entries_normalized: >-
          {{
            pihole_cname_entries_normalized | default([]) +
            [ { 'target': item.target | lower, 'domain': item.domain | lower, 'exists': item.exists | default(true), 'TTL': item.ttl  | default 60 } ]
          }}
      loop: "{{ pihole_cname_entries }}"
      loop_control:
        loop_var: item


    - name: Replace original with normalized
      set_fact:
        pihole_cname_entries: "{{ pihole_cname_entries_normalized }}"

    - name: Config CNAME's
      debug: 
        var: pihole_cname_entries

    - name: Obtain session ID from Pi-hole
      uri:
        url: "{{ pihole_api_url }}/auth"
        method: POST
        body: "{{ {'password': pihole_api_token } | to_json }}"
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
        validate_certs: no  # Disable SSL verification if needed
      register: auth_response

    # - name: Show SID retrieved
    #   debug: 
    #     msg: "Sid retrieved is {{ auth_response.json.session.sid }}"

    - name: Fetch existing Pi-hole CNAME records
      uri:
        url: "{{ pihole_api_url }}/config/dns/cnameRecords"
        method: GET
        headers:
          sid: "{{ auth_response.json.session.sid }}"
      register: existing_cname_response

    - name: Debug raw existing CNAME response
      debug:
        var: existing_cname_response.json

    # - name: Show HOSTS retrieved
    #   debug: 
    #     msg: "Hosts retrieved is {{ existing_cname_response.json.config.dns.cnameRecords }}"

    - name: Set fact for existing records
      set_fact:
        existing_cname: "{{ existing_cname_response.json.config.dns.cnameRecords | default([]) }}"

    # - name: Show CNAME's retrieved
    #   debug: 
    #     msg: "CNAME record is [{{ item }}]"
    #   with_items: "{{ existing_cname }}"
    #   loop_control:
    #     loop_var: item

    - name: Split target and hostname
      debug:
        msg: "DOMAIN: {{ item.split(' ')[0] }}, Target: {{ item.split(',')[1] }}"
      with_items: "{{ existing_cname }}"
      loop_control:
        loop_var: item

    - name: Convert existing CNAME records into dictionaries (simple loop)
      set_fact:
        existing_cname_structured: []
        existing_cname_structured_lowercase: []

    - name: Populate structured cname records original case
      set_fact:
        existing_cname_structured: "{{ existing_cname_structured + [ {'target': item.split(',')[0], 'domain': item.split(',')[1]} ] }}"
      loop: "{{ existing_cname }}"
      when: item.split(',') | length == 2

    - name: Populate structured cname records in lower case
      set_fact:
        existing_cname_structured_lowercase: "{{ existing_cname_structured_lowercase + [ {'domain': item.split(',')[0] | lower, 'target': item.split(',')[1] | lower} ] }}"
      loop: "{{ existing_cname }}"
      when: item.split(',') | length == 2

    - name: Build lookup map for original domain casing
      set_fact:
        original_domain_map: >-
          {{
            original_domain_map | default({}) |
            combine({
              (item.domain, item.target | lower): item.domain
            })
          }}
      loop: "{{ existing_cname_structured }}"

    - name: Create lowercase → original-case domain map
      set_fact:
        domain_case_map: >-
          {{
            existing_cname_structured |
            items2dict(key_name='domain' | lower, value_name='domain')
          }}

    # - name: Show structured existing CNAME Original
    #   debug:
    #     var: existing_cname_structured

    # - name: Show structured existing CNAME LowerCase
    #   debug:
    #     var: existing_cname_structured_lowercase

    - name: Filter entries to add
      set_fact:
        cname_entries_to_add: >-
          {{
            pihole_cname_entries |
            selectattr('exists', 'defined') |
            selectattr('exists') |
            rejectattr('domain', 'in', existing_cname_structured_lowercase | map(attribute='domain') | list) |
            list
          }}

####### Inserts needed.... #########
    - name: Show needed CNAME entries
      debug:
        var: cname_entries_to_add

    - name: Add missing CNAME entries
      uri:
        url: "{{ pihole_api_url }}/config/dns/cnameRecords/{{ (item.domain + ',' + item.target + ',' + item.ttl) | urlencode }}"
        method: PUT
        headers:
          sid: "{{ auth_response.json.session.sid }}"
        status_code: [200, 201]
        validate_certs: no
      loop: "{{ cname_entries_to_add }}"
      when: cname_entries_to_add | length > 0
      register: post_results

    - name: Result from adding CNAME entries
      debug:
        var: post_results
      when: post_results is defined 

    - name: Show results
      debug:
        msg: >
          {% if cname_entries_to_add | length == 0 %}
            All CNAME entries already exist. Nothing to add.
          {% else %}
            Added entries: {{ cname_entries_to_add }}
          {% endif %}
##### end inserts..... #########


######## anything to remove flagged with 'false' for Exists:
    - name: Filter entries to remove that actually exist
      set_fact:
        cname_entries_to_remove: >-
          {{
            pihole_cname_entries |
            selectattr('exists', 'defined') |
            rejectattr('exists') |
            selectattr('domain', 'in', existing_cname_structured_lowercase | map(attribute='domain') | list) |
            selectattr('target', 'in',
              existing_cname_structured_lowercase |
              selectattr('domain', 'in', pihole_cname_entries | map(attribute='domain') | list) |
              map(attribute='target') | list
            ) | list
          }}


    - name: Show CNAME entries to remove
      debug:
        var: cname_entries_to_remove

    - name: Initialize list for delete URLs
      set_fact:
        cname_delete_urls: []

    - name: Append delete URLs with original domain casing
      set_fact:
        cname_delete_urls: "{{ cname_delete_urls + [ (original_domain_map[(item.domain, item.target | lower)]) + ',' + item.target + ',' + item.ttl | urlencode ] }}"
      loop: "{{ cname_entries_to_remove }}"
      when: (item.domain, item.target | lower) in original_domain_map

    - name: Show CNAME entries to remove by original case
      debug:
        var: cname_delete_urls


    - name: Remove CNAME entries from Pi-hole
      uri:
        url: "{{ pihole_api_url }}/config/dns/cnameRecords/{{ item }}"
        method: DELETE
        headers:
          sid: "{{ auth_response.json.session.sid }}"
        status_code: [200, 204]
        validate_certs: no
      loop: "{{ cname_delete_urls }}"
      register: delete_results

    - name: Show deletion results
      debug:
        var: delete_results
      when: delete_results is defined
################### done with removes........

    - name: Logout from Pi-hole session
      uri:
        url: "{{ pihole_api_url }}/auth?sid={{ auth_response.json.session.sid }}"
        method: DELETE
        status_code: 204
        validate_certs: no


