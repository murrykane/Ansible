- name: Add DNS records to Pi-hole idempotently
  hosts: localhost
  gather_facts: no
  vars_files:
    - vars/pihole.yml

  tasks:

    - name: Normalize pihole_dns_entries (lowercase domains)
      set_fact:
        pihole_dns_entries_normalized: >-
          {{
            pihole_dns_entries_normalized | default([]) +
            [ { 'ip': item.ip, 'domain': item.domain | lower, 'exists': item.exists | default(true) } ]
          }}
      loop: "{{ pihole_dns_entries }}"
      loop_control:
        loop_var: item


    - name: Replace original with normalized
      set_fact:
        pihole_dns_entries: "{{ pihole_dns_entries_normalized }}"

    - name: Obtain session ID from Pi-hole
      uri:
        url: "{{ pihole_api_url }}/auth"
        method: POST
        body: "{{ {'password': pihole_api_token } | to_json }}"
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
        validate_certs: no  # Disable SSL verification if needed
      register: auth_response

    # - name: Show SID retrieved
    #   debug: 
    #     msg: "Sid retrieved is {{ auth_response.json.session.sid }}"

    - name: Fetch existing Pi-hole DNS records
      uri:
        url: "{{ pihole_api_url }}/config/dns/hosts"
        method: GET
        headers:
          sid: "{{ auth_response.json.session.sid }}"
      register: existing_dns_response

    - name: Debug raw existing DNS response
      debug:
        var: existing_dns_response.json

    # - name: Show HOSTS retrieved
    #   debug: 
    #     msg: "Hosts retrieved is {{ existing_dns_response.json.config.dns.hosts }}"

    - name: Set fact for existing records
      set_fact:
        existing_dns: "{{ existing_dns_response.json.config.dns.hosts | default([]) }}"

    # - name: Show HOSTS retrieved
    #   debug: 
    #     msg: "DNS record is [{{ item }}]"
    #   with_items: "{{ existing_dns }}"
    #   loop_control:
    #     loop_var: item

    # - name: Split IP and hostname
    #   debug:
    #     msg: "IP: {{ item.split(' ')[0] }}, Hostname: {{ item.split(' ')[1] }}"
    #   with_items: "{{ existing_dns }}"
    #   loop_control:
    #     loop_var: item

    - name: Convert existing DNS records into dictionaries (simple loop)
      set_fact:
        existing_dns_structured: []
        existing_dns_structured_lowercase: []

    - name: Populate structured dns records original case
      set_fact:
        existing_dns_structured: "{{ existing_dns_structured + [ {'ip': item.split()[0], 'domain': item.split()[1]} ] }}"
      loop: "{{ existing_dns }}"
      when: item.split() | length == 2

    - name: Populate structured dns records in lower case
      set_fact:
        existing_dns_structured_lowercase: "{{ existing_dns_structured_lowercase + [ {'ip': item.split()[0], 'domain': item.split()[1] | lower} ] }}"
      loop: "{{ existing_dns }}"
      when: item.split() | length == 2

    - name: Show structured existing DNS Original
      debug:
        var: existing_dns_structured

    - name: Show structured existing DNS LowerCase
      debug:
        var: existing_dns_structured_lowercase

    - name: Filter entries to add
      set_fact:
        dns_entries_to_add: >-
          {{
            pihole_dns_entries |
            selectattr('exists', 'defined') |
            selectattr('exists') |
            rejectattr('domain', 'in', existing_dns_structured_lowercase | map(attribute='domain') | list) |
            list
          }}


    - name: Show needed DNS entries
      debug:
        var: dns_entries_to_add

    - name: Add missing DNS entries
      uri:
        #url: '{{ pihole_api_url }}/config/dns/hosts/{{ item.ip }} {{ item.domain }}'
        url: "{{ pihole_api_url }}/config/dns/hosts/{{ (item.ip + ' ' + item.domain) | urlencode }}"
        method: PUT
        headers:
          sid: "{{ auth_response.json.session.sid }}"
        status_code: [200, 201]
        validate_certs: no
      loop: "{{ dns_entries_to_add }}"
      when: dns_entries_to_add | length > 0
      register: post_results

    - name: Result from adding DNS entries
      debug:
        var: post_results
      when: post_results is defined 

    - name: Show results
      debug:
        msg: >
          {% if dns_entries_to_add | length == 0 %}
            All DNS entries already exist. Nothing to add.
          {% else %}
            Added entries: {{ dns_entries_to_add }}
          {% endif %}

######## anything to remove flagged with 'false' for Exists
    - name: Filter entries to remove that actually exist
      set_fact:
        dns_entries_to_remove: >-
          {{
            pihole_dns_entries |
            selectattr('exists', 'defined') |
            rejectattr('exists') |
            selectattr('domain', 'in', existing_dns_structured_lowercase | map(attribute='domain') | list) |
            selectattr('ip', 'in',
              existing_dns_structured_lowercase |
              selectattr('domain', 'in', pihole_dns_entries | map(attribute='domain') | list) |
              map(attribute='ip') | list
            ) | list
          }}


    - name: Show DNS entries to remove
      debug:
        var: dns_entries_to_remove

    - name: Build lookup map for original domain casing
      set_fact:
        original_domain_map: >-
          {{
            original_domain_map | default({}) |
            combine({
              (item.ip, item.domain | lower): item.domain
            })
          }}
      loop: "{{ existing_dns_structured }}"

    - name: Initialize list for delete URLs
      set_fact:
        dns_delete_urls: []

    - name: Append delete URLs with original domain casing
      set_fact:
        dns_delete_urls: "{{ dns_delete_urls + [ (item.ip + ' ' + original_domain_map[(item.ip, item.domain | lower)]) | urlencode ] }}"
      loop: "{{ dns_entries_to_remove }}"
      when: (item.ip, item.domain | lower) in original_domain_map

    - name: Show DNS entries to remove by original case
      debug:
        var: dns_delete_urls


    - name: Remove DNS entries
      uri:
        url: "{{ pihole_api_url }}/config/dns/hosts/{{ (item.ip + ' ' + item.domain) | urlencode }}"
        method: DELETE
        headers:
          sid: "{{ auth_response.json.session.sid }}"
        status_code: [200, 204]
        validate_certs: no
      loop: "{{ dns_delete_urls }}"
      when: dns_delete_urls | length > 0
      register: delete_results


    - name: Show deletion results
      debug:
        var: delete_results
      when: delete_results is defined
################### done with removes........


#### updates to existing with different IP address

    - name: Detect DNS records with changed IPs
      set_fact:
        dns_entries_to_update: >-
          {{
            pihole_dns_entries |
            selectattr('exists', 'defined') |
            selectattr('exists') |
            selectattr('domain', 'in', existing_dns_structured | map(attribute='domain') | list) |
            rejectattr('domain', 'in',
              existing_dns_structured |
              selectattr('ip', 'defined') |
              selectattr('ip', 'in', pihole_dns_entries | map(attribute='ip') | list) |
              map(attribute='domain') | list
            ) | list
          }}

    - name: Show DNS entries to update
      debug:
        var: dns_entries_to_update

