- name: Add DNS records to Pi-hole idempotently
  hosts: localhost
  gather_facts: no
  vars_files:
    - vars/pihole.yml



# curl --location 'https://pihole3.local.kaneworld.org/api/config/dns/hosts' \
# --header        'sid: v4iacIh/ORqmtf0lIKPTWQ=' \
# --header 'Cookie: sid=v4iacIh/ORqmtf0lIKPTWQ='

  tasks:

    - name: Obtain session ID from Pi-hole
      uri:
        url: "{{ pihole_api_url }}/auth"
        method: POST
        body: "{{ {'password': pihole_api_token } | to_json }}"
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
        validate_certs: no  # Disable SSL verification if needed
      register: auth_response

    # - name: Show SID retrieved
    #   debug: 
    #     msg: "Sid retrieved is {{ auth_response.json.session.sid }}"

    - name: Fetch existing Pi-hole DNS records
      uri:
        url: "{{ pihole_api_url }}/config/dns/hosts"
        method: GET
        headers:
          sid: "{{ auth_response.json.session.sid }}"
      register: existing_dns_response

    - name: Debug raw existing DNS response
      debug:
        var: existing_dns_response.json

    # - name: Show HOSTS retrieved
    #   debug: 
    #     msg: "Hosts retrieved is {{ existing_dns_response.json.config.dns.hosts }}"

    - name: Set fact for existing records
      set_fact:
        existing_dns: "{{ existing_dns_response.json.config.dns.hosts | default([]) }}"

    # - name: Show HOSTS retrieved
    #   debug: 
    #     msg: "DNS record is [{{ item }}]"
    #   with_items: "{{ existing_dns }}"
    #   loop_control:
    #     loop_var: item

    # - name: Split IP and hostname
    #   debug:
    #     msg: "IP: {{ item.split(' ')[0] }}, Hostname: {{ item.split(' ')[1] }}"
    #   with_items: "{{ existing_dns }}"
    #   loop_control:
    #     loop_var: item

    - name: Convert existing DNS records into dictionaries
      set_fact:
        existing_dns_structured: >-
          {{
            existing_dns
            | map('split', ' ')
            | selectattr(0, 'defined')
            | selectattr(1, 'defined')
            | map('community.general.dict_kv', ['ip', 'domain'])
            | list
          }}





    # - name: Convert existing DNS records into dictionaries safely
    #   set_fact:
    #     existing_dns_structured: >-
    #       {{
    #         existing_dns
    #         | map('regex_findall', '^(\\S+)\\s+(\\S+)$')
    #         | map('first')
    #         | select('defined')
    #         | map('combine', ['ip', 'domain'])
    #         | list
    #       }}

    - name: Show structured existing DNS
      debug:
        var: existing_dns_structured

    - name: Filter out DNS records that already exist
      set_fact:
        dns_entries_to_add: >-
          {{
            pihole_dns_entries |
            rejectattr('domain', 'in', existing_dns_structured | map(attribute='domain') | list)
            | list
          }}


    # - name: Filter out DNS records that already exist
    #   set_fact:
    #     dns_entries_to_add: >-
    #       {{ pihole_dns_entries | reject('in', existing_dns | map(attribute='domain') | list) | list }}

    # - name: Add missing DNS entries
    #   uri:
    #     url: "{{ pihole_api_url }}/config/dns/hosts/{{ item.ip }} {{ item.domain }}"
    #     method: PUT
    #     headers:
    #       sid: "{{ auth_response.json.session.sid }}"
    #       #Content-Type: "application/json"
    #     # body_format: json
    #     # body:
    #     #   "{{ item.ip }} {{ item.domain }}"
    #     #   # domain: "{{ item.domain }}"
    #     #   # ip: "{{ item.ip }}"
    #     #   # type: "A"
    #     status_code: [200, 201]
    #     validate_certs: no
    #   loop: "{{ dns_entries_to_add }}"
    #   when: dns_entries_to_add | length > 0
    #   register: post_results

    - name: Show results
      debug:
        msg: >
          {% if dns_entries_to_add | length == 0 %}
            All DNS entries already exist. Nothing to add.
          {% else %}
            Added entries: {{ dns_entries_to_add }}
          {% endif %}

    - name: Logout from Pi-hole session
      uri:
        url: "{{ pihole_api_url }}/auth?sid={{ auth_response.json.session.sid }}"
        method: DELETE
        status_code: 204
        validate_certs: no

