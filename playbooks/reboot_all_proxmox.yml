#- hosts: ubuntu:prox:debian
- hosts: coco.kane.mk:athena.kane.mk:apex.kane.mk:proxmox.kane.mk:
  become: yes

  vars:
    reboot_delay: 90
    
  tasks:
    - name: Perform reboot
      ansible.builtin.reboot:
        post_reboot_delay: "{{ reboot_delay }}"
        pre_reboot_delay: "{{ reboot_delay }}"

