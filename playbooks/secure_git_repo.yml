---
# secure-git-repo.yml
#
# Deploys gitleaks-based secret scanning on the host where the source-controlled
# repo lives (e.g. kaneserver.kane.mk), so secrets like .env / cf_secret / keys
# never make it into a commit in the first place.
#
# What this does:
#   1. Installs the gitleaks binary to a persistent, array-backed path
#      (important on Unraid - / and /usr/local are tmpfs and wiped on reboot).
#   2. Deploys a repo-specific .gitleaks.toml with rules tuned for your
#      .env / cf_secret naming conventions, on top of gitleaks' default ruleset.
#   3. Installs a `pre-commit` git hook that runs `gitleaks protect --staged`
#      and REFUSES the commit if a secret is detected. The hook resolves
#      gitleaks via PATH first, so it works correctly whether you're committing
#      via SSH directly on kaneserver, OR from a client machine that has the
#      repo mapped/mounted (e.g. Windows over CIFS). In the latter case,
#      gitleaks must ALSO be installed on that client machine and be on its
#      PATH - see https://github.com/gitleaks/gitleaks/releases for Windows
#      builds. Without that, the hook will correctly refuse to commit rather
#      than silently skip the scan.
#   4. Adds a `git addsafe` alias as a belt-and-braces option for people who
#      like to check before they even git add.
#   5. Runs an immediate scan of the working tree. Any UNTRACKED file that
#      trips a rule gets its path appended to .gitignore automatically.
#   6. Any ALREADY-TRACKED file that trips a rule is only reported, never
#      auto-modified - .gitignore can't retroactively remove something from
#      history, so that needs a manual git-filter-repo/BFG pass + rotation.
#   7. (when provision_ci=true) Deploys a gitleaks GitHub Actions workflow
#      into the repo, opens a PR against main, and restores repo ownership
#      afterward so client machines (Windows/VSCode over CIFS) can keep
#      committing to the share without permission errors.
#
# Usage (CLI):
#   ansible-playbook -i inventory secure-git-repo.yml -e repo_name=ansible
#
# Usage (Semaphore):
#   Create a Task Template against this playbook, then add Survey Variables:
#     Name:   repo_name
#     Title:  "Which sourcecontrol repo?"
#     Type:   enum  (renders as a dropdown)
#     Values: scripts,ansible,terraform,homelab,murdog,kaneworld
#
#     Name:   provision_ci
#     Title:  "Provision gitleaks GitHub Actions workflow + PR?"
#     Type:   boolean
#     Default: false
#   Semaphore passes these in as -e repo_name=<selection> -e provision_ci=<bool>,
#   which this playbook resolves against sourcecontrol_base below. No editing
#   the playbook per-repo required.
#
# Requires: your inventory has a host/group called "kaneserver" (rename the
# `hosts:` line below to match your actual inventory alias if different).
#
# Requires for provision_ci=true:
#   - github_pat sourced from Infisical (fine-grained PAT, Contents=RW,
#     Pull requests=RW), scoped to the repos this playbook touches.
#   - root@<host> has an account-level SSH key registered on your GitHub
#     account (not a per-repo deploy key - those can't be reused across
#     repos) at /root/.ssh/id_ed25519_github.
#   - DISCORD_WEBHOOK_URL must be added as a repo secret manually per repo
#     (Settings -> Secrets and variables -> Actions) - not automated here,
#     see the optional gh-secret-set task at the bottom.
#   - A branch-protection rule on main requiring the `gitleaks` status check
#     is a one-time manual GitHub UI step per repo, also not automated here.

- name: Deploy pre-commit secret scanning (gitleaks) on kaneserver
  hosts: "{{ scriptinventory | default('kaneserver.kane.mk') }}"
  become: true
  gather_facts: true

  vars:

    provision_ci: false                 # survey var; true = deploy+PR the workflow
    github_pat: ""                      # from Infisical - repo-scoped fine-grained PAT
    #discord_webhook_notify_repo_secret: "DISCORD_WEBHOOK_URL"

    # --- EDIT THESE FOR YOUR ENVIRONMENT ---
    sourcecontrol_base: "/mnt/user/data/sourcecontrol"

    # repo_name is supplied via Semaphore survey (or -e repo_name=... on the CLI).
    # "workspaces" is deliberately excluded - that's VSCode scratch space, not a repo.
    repo_name: ""
    allowed_repos:
      - scripts
      - ansible
      - terraform
      - homelab
      - murdog
      - kaneworld

    git_repo_path: "{{ sourcecontrol_base }}/{{ repo_name }}"

    gitleaks_version: "8.21.2"          # bump as needed; check https://github.com/gitleaks/gitleaks/releases
    gitleaks_install_dir: "/mnt/user/AppData/gitleaks/bin"   # persistent on Unraid array, NOT /usr/local/bin
    gitleaks_symlink: "/usr/local/bin/gitleaks"               # convenience symlink (recreated by this playbook each run)
    gitleaks_config_path: "{{ git_repo_path }}/.gitleaks.toml"

    # Baseline patterns always kept in .gitignore, regardless of scan results
    baseline_gitignore_patterns:
      - ".env"
      - ".env.*"
      - "*cf_secret*"
      - "*_secret*"
      - "*.pem"
      - "*_rsa"
      - "*.pub"
      - "id_ed25519*"
      - "*.key"
      - "secrets.yml"
      - "vault_pass*"
      - "key"
      - "*.bak"
      - "*.save"
      - "*_backup"
      - "*.orig"
      - "acme.json"
      - "wg*.conf"

  tasks:
    # ---------- Validate the survey input before doing anything else ----------
    - name: Ensure repo_name was supplied
      ansible.builtin.fail:
        msg: >-
          repo_name is required - pass it via Semaphore survey or
          -e repo_name=<one of: {{ allowed_repos | join(', ') }}>
      when: not repo_name

    - name: Ensure repo_name is a known, allowed repo
      ansible.builtin.fail:
        msg: >-
          '{{ repo_name }}' is not in the allowed repo list
          ({{ allowed_repos | join(', ') }}). If you just added a new repo
          under {{ sourcecontrol_base }}, add it to allowed_repos in this
          playbook first - this whitelist is intentional so a typo can't
          point the scan/hooks at an arbitrary path.
      when: repo_name not in allowed_repos

    # ---------- Install gitleaks ----------
    - name: Determine gitleaks release arch string
      ansible.builtin.set_fact:
        gitleaks_arch: "{{ 'x64' if ansible_architecture == 'x86_64' else 'arm64' }}"

    - name: Ensure persistent install dir exists
      ansible.builtin.file:
        path: "{{ gitleaks_install_dir }}"
        state: directory
        mode: "0755"

    - name: Check currently installed gitleaks version
      ansible.builtin.command: "{{ gitleaks_install_dir }}/gitleaks version"
      register: gitleaks_current
      changed_when: false
      failed_when: false

    - name: Install gitleaks if missing or wrong version
      when: gitleaks_version not in (gitleaks_current.stdout | default(''))
      block:
        - name: Download gitleaks release tarball
          ansible.builtin.get_url:
            url: "https://github.com/gitleaks/gitleaks/releases/download/v{{ gitleaks_version }}/gitleaks_{{ gitleaks_version }}_linux_{{ gitleaks_arch }}.tar.gz"
            dest: "/tmp/gitleaks_{{ gitleaks_version }}.tar.gz"
            mode: "0644"

        - name: Extract gitleaks binary
          ansible.builtin.unarchive:
            src: "/tmp/gitleaks_{{ gitleaks_version }}.tar.gz"
            dest: "{{ gitleaks_install_dir }}"
            remote_src: true
            include:
              - gitleaks

        - name: Ensure gitleaks binary is executable
          ansible.builtin.file:
            path: "{{ gitleaks_install_dir }}/gitleaks"
            mode: "0755"

    - name: Symlink gitleaks into PATH
      ansible.builtin.file:
        src: "{{ gitleaks_install_dir }}/gitleaks"
        dest: "{{ gitleaks_symlink }}"
        state: link
        force: true

    # ---------- Sanity check the repo ----------
    - name: Confirm target path is a git repo
      ansible.builtin.stat:
        path: "{{ git_repo_path }}/.git"
      register: repo_git_dir

    - name: Fail fast if not a git repo
      ansible.builtin.fail:
        msg: >-
          {{ git_repo_path }} (repo_name={{ repo_name }}) has no .git
          directory. Clone/init it first, then re-run.
      when: not repo_git_dir.stat.exists

    # ---------- Git environment fixes (apply to EVERY repo, every run) ----------
    # root (via become: true) is not the uid that owns these repos on the
    # Unraid array, and these repos are also opened directly from Windows/
    # VSCode over the same Samba share. Both of the tasks below fix
    # environment quirks that otherwise break git for one side or the other.

    - name: Check existing git safe.directory entries
      ansible.builtin.command: git config --global --get-all safe.directory
      register: safe_dirs
      changed_when: false
      failed_when: false   # rc=1 just means no entries exist yet - not an error

    - name: Mark repo path as a git safe.directory (avoids 'dubious ownership' when running as root against a non-root-owned path)
      ansible.builtin.command: "git config --global --add safe.directory {{ git_repo_path }}"
      when: git_repo_path not in (safe_dirs.stdout_lines | default([]))
      changed_when: true
      # Using --add (not a plain `git config --global safe.directory <path>`)
      # because that OVERWRITES the setting rather than appending, which
      # would clobber safe.directory entries from other repos each time
      # this runs against a different repo_name.

    - name: Check current core.fileMode setting
      ansible.builtin.command: "git -C {{ git_repo_path }} config --get core.fileMode"
      register: filemode_check
      changed_when: false
      failed_when: false   # unset returns rc=1 - not an error, just means it's on the (default true) setting

    - name: Disable filemode tracking (Samba/CIFS shares don't reliably preserve exec bits, causing every tracked file to show as falsely 'modified')
      ansible.builtin.command: "git -C {{ git_repo_path }} config core.fileMode false"
      when: filemode_check.stdout | trim != 'false'
      changed_when: true

    # ---------- Deploy config ----------
    - name: Deploy repo-specific gitleaks config
      ansible.builtin.copy:
        dest: "{{ gitleaks_config_path }}"
        mode: "0644"
        content: |
          title = "kaneworld gitleaks config"

          [extend]
          useDefault = true

          [[rules]]
          id = "generic-dotenv-file"
          description = "Any .env style file"
          regex = '''(?i)^.*\.env(\..*)?$'''
          path = '''(^|/)\.env(\..*)?$'''

          [[rules]]
          id = "generic-pub-file"
          description = "Any .pub style file"
          regex = '''(?i)^.*\.pub$'''
          path = '''(^|/)\.pub$'''

          [[rules]]
          id = "cf-secret-file"
          description = "Cloudflare secret / token file"
          regex = '''(?i)cf[_-]?secret'''
          path = '''(?i)cf[_-]?secret'''

          [[rules]]
          id = "apprise-discord-webhook-url"
          description = "Apprise-style discord://webhook_id/webhook_token URL (default rules only catch key:value or discord.com/api/webhooks/... shapes, not this)"
          regex = '''discord://\d{15,20}/[A-Za-z0-9_-]{60,90}'''

          [[rules]]
          id = "apprise-discord-webhook-url-mailrise"
          description = "Apprise-style http.*discord.com/ URL (default rules only catch key:value or discord.com/api/webhooks/... shapes, not this)"
          regex = '''http.*discord.*/\d{15,20}/[A-Za-z0-9_-]{60,90}'''

          [[rules]]
          id = "gotify-webhook-url-mailrise"
          description = "Gotify-style gotifys://gotify.* URL (default rules only catch key:value or discord.com/api/webhooks/... shapes, not this)"
          regex = '''gotifys://gotify.*/[a-zA-Z0-9]{12,20}'''

          [[rules]]
          id = "yaml-base64-secret"
          description = "secret/token/password/key-style value in any YAML file, base64-encoded (base64 chars / and + truncate the default generic-api-key regex match)"
          regex = '''(?i)(?:secret|token|password|passwd|pwd|api[_-]?key|client[_-]?secret|access[_-]?key|private[_-]?key|auth[_-]?token)\s*:\s*["']?[A-Za-z0-9+/]{20,}={0,2}["']?'''
          path = '''\.ya?ml$'''

          [[rules]]
          id = "wireguard-config-or-backup"
          description = "WireGuard config/backup - contains PrivateKey by nature, flagged on presence not content pattern"
          path = '''(^|/)wg\d*\.conf([._-]?(backup|bak|save|old|orig))?$'''
          regex = '''(?s).+'''

          [[rules]]
          id = "traefik-acme-storage"
          description = "Traefik ACME storage (acme.json) - contains account + cert private keys, flagged on presence not content pattern"
          path = '''(^|/)acme\.json([._-]?(backup|bak|save|old|orig))?$'''
          regex = '''(?s).+'''

          [allowlist]
          description = "Paths gitleaks should never scan"
          paths = [
            '''\.git/''',
          ]

    - name: Ensure baseline secret patterns are in .gitignore
      ansible.builtin.lineinfile:
        path: "{{ git_repo_path }}/.gitignore"
        create: true
        line: "{{ item }}"
        insertafter: EOF
      loop: "{{ baseline_gitignore_patterns }}"

    # ---------- Install hooks ----------
    - name: Deploy pre-commit hook (blocks commit on detected secret)
      ansible.builtin.copy:
        dest: "{{ git_repo_path }}/.git/hooks/pre-commit"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Installed by Ansible (secure-git-repo.yml) - edit the playbook, not this file.
          set -euo pipefail

          # This hook runs wherever `git commit` actually executes - which may
          # be kaneserver itself (SSH) OR a client machine that has this repo
          # mapped/mounted (e.g. Windows over CIFS, using Git for Windows'
          # bash). A hardcoded Unraid path only works in the former case, so:
          #   1. Prefer whatever "gitleaks" resolves to on PATH - this is what
          #      makes it work from a Windows client, PROVIDED gitleaks.exe is
          #      installed there and on that machine's PATH.
          #   2. Fall back to the known persistent install path, for when this
          #      runs directly on kaneserver via SSH without the /usr/local/bin
          #      symlink in PATH.
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          CONFIG="$REPO_ROOT/.gitleaks.toml"

          if command -v gitleaks >/dev/null 2>&1; then
            GITLEAKS_BIN="$(command -v gitleaks)"
          elif [ -x "{{ gitleaks_install_dir }}/gitleaks" ]; then
            GITLEAKS_BIN="{{ gitleaks_install_dir }}/gitleaks"
          else
            echo "gitleaks not found on PATH, and not found at {{ gitleaks_install_dir }}/gitleaks" >&2
            echo "If you're committing from a Windows client, install gitleaks.exe there and add it to your PATH." >&2
            echo "If you're on kaneserver directly, re-run the secure-git-repo Semaphore task." >&2
            exit 1
          fi

          echo "Running gitleaks on staged changes..."
          if ! "$GITLEAKS_BIN" protect --staged --config "$CONFIG" --redact -v; then
            echo ""
            echo "COMMIT BLOCKED: gitleaks found a likely secret in your staged changes."
            echo "Rotate/remove the secret or add the file to .gitignore, then re-stage."
            exit 1
          fi

          exit 0

    - name: Add a `git addsafe` alias (scan-then-stage convenience)
      ansible.builtin.blockinfile:
        path: "{{ git_repo_path }}/.git/config"
        marker: "# {mark} ANSIBLE MANAGED - gitleaks addsafe alias"
        insertafter: EOF
        block: |
          [alias]
            addsafe = "!f() { git add \"$@\" && gitleaks protect --staged --config \"$(git rev-parse --show-toplevel)/.gitleaks.toml\" --redact -v || (git reset -- \"$@\" && echo 'Secret detected - files unstaged automatically.'); }; f"

    # ---------- Scan the current working tree ----------
    - name: Run gitleaks against the working tree now
      ansible.builtin.command: >
        {{ gitleaks_install_dir }}/gitleaks detect
        --source .
        --config {{ gitleaks_config_path }}
        --no-git
        --report-format json
        --report-path /tmp/gitleaks_report.json
        --exit-code 0
      args:
        chdir: "{{ git_repo_path }}"
      changed_when: false

    - name: Read scan report
      ansible.builtin.command: cat /tmp/gitleaks_report.json
      register: gitleaks_report_raw
      changed_when: false

    - name: Parse findings into a unique file list
      ansible.builtin.set_fact:
        gitleaks_found_files: >-
          {{ (gitleaks_report_raw.stdout | from_json) | map(attribute='File') | unique | list
             if (gitleaks_report_raw.stdout | trim) not in ['', '[]'] else [] }}

    - name: Check git-tracked status of each finding
      ansible.builtin.command: "git -C {{ git_repo_path }} ls-files --error-unmatch {{ item }}"
      register: tracked_check
      loop: "{{ gitleaks_found_files }}"
      changed_when: false
      failed_when: false
      when: gitleaks_found_files | length > 0

    - name: Build untracked-secret-file list
      ansible.builtin.set_fact:
        untracked_secret_files: "{{ tracked_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    - name: Build already-tracked-secret-file list
      ansible.builtin.set_fact:
        tracked_secret_files: "{{ tracked_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}"

    - name: Add newly discovered untracked secret files to .gitignore
      ansible.builtin.lineinfile:
        path: "{{ git_repo_path }}/.gitignore"
        create: true
        line: "{{ item }}"
        insertafter: EOF
      loop: "{{ untracked_secret_files }}"

    - name: Report untracked files that were added to .gitignore
      ansible.builtin.debug:
        msg: "Added to .gitignore (was untracked, now excluded): {{ untracked_secret_files }}"
      when: untracked_secret_files | length > 0

    - name: WARN about secrets already committed to history
      ansible.builtin.debug:
        msg: >-
          WARNING: these files are already tracked in git history and matched
          a secret rule. .gitignore does NOT remove them from history - you'll
          need `git filter-repo` (or BFG Repo-Cleaner) to purge them, plus
          rotating the actual credential, since it's already exposed to
          anyone with repo access: {{ tracked_secret_files }}
      when: tracked_secret_files | length > 0

    # ---------- Provision repo-level CI: gitleaks workflow + PR ----------
    - name: Ensure .github/workflows directory exists in repo
      ansible.builtin.file:
        path: "{{ git_repo_path }}/.github/workflows"
        state: directory
        mode: "0755"
      when: provision_ci | default(false) | bool

    - name: Deploy gitleaks GitHub Actions workflow (verbatim - no Jinja templating)
      ansible.builtin.copy:
        src: files/gitleaks-github-workflow.yml
        dest: "{{ git_repo_path }}/.github/workflows/gitleaks.yml"
        mode: "0644"
      when: provision_ci | default(false) | bool

    - name: Check whether CI files actually changed
      ansible.builtin.command: >
        git -C {{ git_repo_path }} status --porcelain
        .github/workflows/gitleaks.yml .gitleaks.toml
      register: ci_git_status
      changed_when: false
      when: provision_ci | default(false) | bool

    - name: Capture original repo ownership (to restore after root touches .git/refs and .git/objects)
      ansible.builtin.stat:
        path: "{{ git_repo_path }}"
      register: repo_owner_stat
      when: provision_ci | default(false) | bool

    - name: Ensure root's known_hosts trusts github.com (avoids interactive host-key prompt hanging under Ansible)
      ansible.builtin.command: ssh-keyscan -H github.com
      register: github_keyscan
      changed_when: false
      when: provision_ci | default(false) | bool

    - name: Add github.com to a WRITABLE known_hosts path (not /root/.ssh - that's symlinked to the boot flash on Unraid, which is vfat and can't support the atomic rewrite known_hosts needs)
      ansible.builtin.known_hosts:
        name: github.com
        key: "{{ item }}"
        path: /root/.git_known_hosts
        state: present
      loop: "{{ github_keyscan.stdout_lines }}"
      when: provision_ci | default(false) | bool

    - name: Bootstrap CI files via branch + PR
      when:
        - provision_ci | default(false) | bool
        - ci_git_status.stdout | trim != ''
      block:
        - name: Create/reset bootstrap branch
          ansible.builtin.command: "git -C {{ git_repo_path }} checkout -B ci/gitleaks-bootstrap"
          changed_when: true

        - name: Stage CI files
          ansible.builtin.command: >
            git -C {{ git_repo_path }} add
            .github/workflows/gitleaks.yml .gitleaks.toml
          changed_when: true

        - name: Commit CI files
          ansible.builtin.command: >
            git -C {{ git_repo_path }}
            -c user.name="ansible-bot"
            -c user.email="ansible-bot@kane.mk"
            commit -m "ci: add gitleaks secret scanning workflow"
          changed_when: true

        - name: Push bootstrap branch (explicit SSH URL, NOT the stored 'origin' remote - origin's protocol/state is shared config on this Samba path and varies per repo)
          ansible.builtin.command: >
            git -C {{ git_repo_path }} push
            git@github.com:murrykane/{{ repo_name }}.git
            ci/gitleaks-bootstrap:ci/gitleaks-bootstrap
            --force-with-lease
          environment:
            GIT_SSH_COMMAND: >-
              ssh -i /root/.ssh/id_ed25519_github -o IdentitiesOnly=yes
              -o UserKnownHostsFile=/root/.git_known_hosts
              -o StrictHostKeyChecking=accept-new
          changed_when: true

        - name: Open PR via GitHub API
          ansible.builtin.uri:
            url: "https://api.github.com/repos/murrykane/{{ repo_name }}/pulls"
            method: POST
            headers:
              Authorization: "Bearer {{ github_pat }}"
              Accept: "application/vnd.github+json"
            body_format: json
            body:
              title: "ci: add gitleaks secret scanning workflow"
              head: "ci/gitleaks-bootstrap"
              base: "main"
              body: >-
                Adds .github/workflows/gitleaks.yml, provisioned by
                secure-git-repo.yml. This blocks merging to main on a
                detected secret and posts to Discord - pair it with a
                branch-protection rule on main requiring the `gitleaks`
                check, if that isn't set already.
            status_code: [201, 422]   # 422 = a PR for this branch already exists, not fatal
          register: pr_result

        - name: Report PR outcome
          ansible.builtin.debug:
            msg: >-
              {{ pr_result.json.html_url if pr_result.status == 201
                 else 'ci/gitleaks-bootstrap already has an open PR (or another 422 reason) - check GitHub.' }}

        - name: Return to the branch you started on
          ansible.builtin.command: "git -C {{ git_repo_path }} checkout -"
          changed_when: false

      always:
        # Runs whether the block above succeeded, failed, or was skipped
        # part-way through - restores whatever uid/gid the repo had before
        # root created new refs/objects, so a client machine (e.g. over
        # CIFS/VSCode) can still write to those refs afterward.
        - name: Restore original owner:group on the whole repo
          ansible.builtin.file:
            path: "{{ git_repo_path }}"
            owner: "{{ repo_owner_stat.stat.pw_name }}"
            group: "{{ repo_owner_stat.stat.gr_name }}"
            recurse: true
          when: repo_owner_stat.stat is defined

    # ---------- OPTIONAL: also provision the Discord webhook repo secret ----------
    # Uncomment if `gh` CLI is installed and authenticated (gh auth login) on
    # the host this playbook runs on. Requires discord_webhook_url as a var,
    # also sourced from Infisical - don't inline the real webhook URL here.
    #
    # - name: Set DISCORD_WEBHOOK_URL repo secret via gh CLI
    #   ansible.builtin.command: >
    #     gh secret set {{ discord_webhook_notify_repo_secret }}
    #     --repo murrykane/{{ repo_name }}
    #     --body "{{ discord_webhook_url }}"
    #   when: provision_ci | default(false) | bool
    #   changed_when: true
    #   no_log: true   # don't let the webhook URL land in Semaphore's task output
