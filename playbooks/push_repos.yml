# set permissions on synranized repo on cyborg before pushing to other servers since the synchronize module does not preserve permissions 
# when pulling from a remote source (rsync -a does not work with remote sources)
- name: Pull repos from GitHub to cyborg
  hosts: cyborg.kane.mk    # will change permissions before pushing to all other servers 
  gather_facts: false
  become: true
  vars_files:
    - vars/repo_targets.yml

  tasks:

    # - name: Set permissions on Repos on cyborg
    #   ansible.builtin.file:
    #     path: "{{ repo_base_path }}"
    #     owner: semaphore
    #     group: repogroup
    #     mode: '0755'
    #     recurse: yes
    #   become: true

    #####   SLOWWWWWWWWWWWWWWWW ###########
    # - name: Find all directories
    #   ansible.builtin.find:
    #     paths: "{{ repo_base_path }}"
    #     file_type: directory
    #     recurse: yes
    #   register: found_directories

    # - name: Find all files
    #   ansible.builtin.find:
    #     paths: "{{ repo_base_path }}"
    #     file_type: file
    #     recurse: yes
    #   register: found_files

    # - name: Set directory permissions to 0755
    #   ansible.builtin.file:
    #     path: "{{ item.path }}"
    #     owner: semaphore
    #     group: repogroup
    #     mode: '0755'
    #   loop: "{{ found_directories.files }}"

    # - name: Set file permissions to 0644
    #   ansible.builtin.file:
    #     path: "{{ item.path }}"
    #     owner: semaphore
    #     group: repogroup
    #     mode: '0644'
    #   loop: "{{ found_files.files }}"
    #####  SLOW end ###############

    # lets remove .git and .gitignore files and set permissions on the rest of the tree using native find and chmod since the ansible file module is very slow on large trees
    - name: Find files to remove 
      ansible.builtin.find: 
        paths: "{{ repo_base_path }}" 
        patterns: 
          - ".git"
          - ".gitignore"
          - "README.md"
        file_type: any
        hidden: true
        recurse: yes
        use_regex: true
      ignore_errors: true
      register: vct_files

    - name: Remove unwanted files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ vct_files.files }}"

    # Use native chmod for bulk permission changes (much faster on large trees)
    - name: Set directory permissions recursively
      ansible.builtin.command:
        cmd: find "{{ repo_base_path }}" -type d -exec chmod 0755 {} +
      changed_when: true

    - name: Set file permissions recursively
      ansible.builtin.command:
        cmd: find "{{ repo_base_path }}" -type f -exec chmod 0644 {} +
      changed_when: true

    - name: Set ownership recursively
      ansible.builtin.file:
        path: "{{ repo_base_path }}"
        owner: semaphore
        group: repogroup
        recurse: yes

    # #need to set certain files to 600 like cf_token and acme.json for traefik
    # - name: Set Private files to correct permissions ( cf_token and acme.json 600)
    #   ansible.builtin.command:
    #     cmd: find "{{ repo_base_path }}" -type f \(-name "cf-token" -o -name "acme.json" \) -exec chmod 0600 {} +

    - name: Find private files
      ansible.builtin.find:
        paths: "{{ repo_base_path }}"
        patterns:
          - "cf-token"
          - "acme.json"
        recurse: true
      register: private_files

    - name: Set private files to 600
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "0600"
      loop: "{{ private_files.files }}"

# setup repogroup and permissions on target servers before pushing repos
- name: Setup repo group and permissions on target servers
  hosts: repo_servers
  gather_facts: false
  vars_files:
    - vars/repo_targets.yml

  tasks:
    - name: Ensure repogroup exists
      ansible.builtin.group:
        name: repogroup
        gid: 1004
        state: present
      become: true

    - name: Add users to repogroup
      ansible.builtin.user:
        name: "{{ item }}"
        groups: repogroup
        append: true
      loop:
        - murry
        - semaphore
      become: true

    - name: Ensure dest base directory exists with correct ownership
      ansible.builtin.file:
        path: "{{ dest_base_path }}"
        state: directory
        #owner: root
        owner: semaphore
        group: repogroup
        mode: '2775'
      become: true

# Push the code
- name: Push code repositories to target servers
  hosts: repo_servers
  gather_facts: false
  vars_files:
    - vars/repo_targets.yml

  tasks:
    - name: Ensure destination base directory exists
      ansible.builtin.file:
        path: "{{ dest_base_path }}"
        state: directory
        mode: '0755'
      become: true

    - name: Sync repos to servers that are listed as targets
      ansible.builtin.synchronize:
        src: "{{ item.src }}/"
        dest: "{{ dest_base_path }}/{{ item.name }}"
        delete: true
        recursive: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.gitignore"
          - "--exclude=README.md"
      loop: "{{ repos | selectattr('targets', 'contains', inventory_hostname) | list }}"
      loop_control:
        label: "{{ item.name }} → {{ inventory_hostname }}"
      become: true

# ---------------------------------------------------------------------------
# NEW PLAY: overlay matched kaneworld repo directories onto live container dirs
#
# For each docker host, find the immediate subdirectories under
# /home/murry/containers/ (these are the compose project directories you run
# `docker compose up/down/pull` against) and the immediate subdirectories
# under /opt/repos/kaneworld/ (the freshly pushed, gitleaks-cleaned repo).
# Where a directory name exists in BOTH, source control wins for anything
# it tracks: repo files overwrite the matching live files. NOTHING IS
# DELETED — data directories, .env files, acme.json, and anything else
# sitting in the live container directory that isn't tracked in the repo
# is left completely untouched (no --delete flag on rsync).
# ---------------------------------------------------------------------------
- name: Sync matched kaneworld repo directories into live container directories
  #hosts: mkserver.kane.mk,docker-ceph.kane.mk,auth.kane.mk,docker-dev.kane.mk,cyborg.kane.mk,kaneserver.kane.mk,murdognas.kane.mk
  hosts: docker 
  gather_facts: false
  vars:
    containers_base_path: /home/murry/containers
    kaneworld_repo_path: /opt/repos/kaneworld
 
  tasks:
    - name: Find live container directories on this host
      ansible.builtin.find:
        paths: "{{ containers_base_path }}"
        file_type: directory
        recurse: false
      register: container_dirs
 
    - name: Find kaneworld repo directories on this host
      ansible.builtin.find:
        paths: "{{ kaneworld_repo_path }}"
        file_type: directory
        recurse: false
      register: repo_dirs
 
    - name: Determine directory names present in both locations
      ansible.builtin.set_fact:
        matched_containers: >-
          {{
            (container_dirs.files | map(attribute='path') | map('basename') | list)
            | intersect(repo_dirs.files | map(attribute='path') | map('basename') | list)
          }}
 
    - name: Show which containers matched a repo directory
      ansible.builtin.debug:
        msg: "{{ matched_containers }}"
 
