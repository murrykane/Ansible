---
# =============================================================================
# apt.yml - patch hosts, then reboot them safely.
#
#   1. Upgrade   every non-Proxmox host in parallel. The upgrade runs async so a
#                dropped SSH session (sshd / docker / systemd restarted by a
#                package) can no longer hang the whole run: Ansible re-polls over a
#                fresh connection, and a host that is truly stuck fails after 30 min
#                instead of blocking everyone.
#   2. Upgrade   Proxmox nodes ONE AT A TIME. Ceph must report HEALTH_OK before the
#                next node is touched; any failure stops the play.
#   3. Reboot    ONE host at a time. Each host must come back (and its containers be
#                healthy) before the next one goes down. A failure stops the play, so
#                a bad reboot never cascades. Honors reboot_flag (group_vars: ubuntu =
#                true, prox = false). Hosts that need a reboot but have reboot_flag
#                false only get a Discord notice.
#   4. Scheduled reboot for the hosts Semaphore itself depends on (any host that sets
#                scheduled_reboot_minutes in host_vars: the Semaphore host and the host
#                running its database). They cannot be rebooted mid-run, so
#                `shutdown -r +N` is queued and the run finishes first.
#
# scriptinventory is the Semaphore survey variable (a group or host pattern). The plays
# below narrow it with :!prox / :&prox.
#
# Discord notices are sent from the Semaphore container (delegate_to localhost), never
# block patching if Discord is down, and need `discord_webhook_token` as before.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Upgrade - everything except Proxmox, in parallel
# -----------------------------------------------------------------------------
- name: "1/4 Upgrade packages (non-Proxmox hosts, in parallel)"
  hosts: "{{ scriptinventory }}:!prox"
  become: true
  gather_facts: false

  tasks:
    - name: Check whether needrestart is installed
      ansible.builtin.stat:
        path: /etc/needrestart/conf.d
      register: needrestart_dir

    # needrestart (Ubuntu 22.04+) restarts services right after the packages that
    # need it. When that service is sshd, docker or systemd-logind it kills the SSH
    # session Ansible is using. 'l' = list only: reboots happen later, in a controlled
    # way (play 3/4). Services whose libraries changed (but not the kernel) keep
    # running the old code until the next reboot.
    - name: Stop needrestart restarting services during the upgrade
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/50-ansible.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/apt.yml)
          $nrconf{restart} = 'l';
      when: needrestart_dir.stat.exists and needrestart_dir.stat.isdir

    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300
      async: 1800   # fail this host after 30 min rather than hang the run forever
      poll: 15      # re-check every 15s over a new connection (survives SSH drops)

# -----------------------------------------------------------------------------
# 2. Upgrade - Proxmox nodes, one at a time, Ceph healthy between nodes
# -----------------------------------------------------------------------------
- name: "2/4 Upgrade Proxmox nodes (one at a time)"
  hosts: "{{ scriptinventory }}:&prox"
  become: true
  gather_facts: false
  serial: 1
  order: sorted   # same order every run (alphabetical)
  any_errors_fatal: true

  tasks:
    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300
      async: 1800
      poll: 15

    # Only the Ceph members (prox-cluster); 'mini' is a standalone node.
    - name: Wait for Ceph HEALTH_OK before touching the next node
      ansible.builtin.command: ceph health
      register: ceph_health
      until: ceph_health.rc == 0 and 'HEALTH_OK' in ceph_health.stdout
      retries: 30
      delay: 10
      changed_when: false
      when: "'prox-cluster' in group_names"

# -----------------------------------------------------------------------------
# 3. Reboot - one host at a time, each must be healthy before the next goes down
# -----------------------------------------------------------------------------
- name: "3/4 Reboot hosts one at a time"
  hosts: "{{ scriptinventory }}"
  become: true
  gather_facts: false
  serial: 1
  order: sorted   # same order every run (alphabetical)
  any_errors_fatal: true

  vars:
    discord_webhook_id: "1149362209001054268"
    reboot_timeout: 900         # seconds to wait for the host to come back
    reboot_settle_seconds: 60    # extra wait after SSH is back, before health checks
    health_retries: 30           # x health_delay = 5 min for containers to be healthy
    health_delay: 10

  tasks:
    # Hosts with scheduled_reboot_minutes are handled by play 4.
    - name: Skip hosts that get a scheduled reboot instead
      ansible.builtin.meta: end_host
      when: scheduled_reboot_minutes is defined

    - name: Check reboot status
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false
      register: reboot_required

    - name: Show reboot decision
      ansible.builtin.debug:
        msg:
          - "reboot_required: {{ reboot_required.stat.exists }}"
          - "reboot_flag: {{ reboot_flag | default(false) }}"

    - name: Discord - reboot needed but automatic reboot is off for this host
      community.general.discord:
        webhook_id: "{{ discord_webhook_id }}"
        webhook_token: "{{ discord_webhook_token }}"
        content: "A reboot is required on [{{ inventory_hostname }}] but automatic reboot is disabled for it (reboot_flag false). Reboot it manually."
        username: Ansible
        avatar_url: "https://pantheon.tech/wp-content/uploads/2019/04/ansible.png"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      ignore_errors: true   # a Discord outage must never block patching
      when:
        - reboot_required.stat.exists
        - not (reboot_flag | default(false) | bool)

    - name: Reboot, then verify the host is healthy
      when:
        - reboot_required.stat.exists
        - reboot_flag | default(false) | bool
      block:
        - name: Discord - rebooting now
          community.general.discord:
            webhook_id: "{{ discord_webhook_id }}"
            webhook_token: "{{ discord_webhook_token }}"
            content: "Rebooting [{{ inventory_hostname }}] now (one host at a time)."
            username: Ansible
            avatar_url: "https://pantheon.tech/wp-content/uploads/2019/04/ansible.png"
          delegate_to: localhost
          become: false
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ignore_errors: true

        - name: Reboot and wait for the host to come back
          ansible.builtin.reboot:
            msg: "Ansible: reboot after package updates"
            pre_reboot_delay: 0
            post_reboot_delay: "{{ reboot_settle_seconds }}"
            reboot_timeout: "{{ reboot_timeout }}"
            test_command: uptime

        - name: Check whether Docker is installed
          ansible.builtin.stat:
            path: /usr/bin/docker
          register: docker_present

        # Gate: do not reboot the next host until every container here is up and
        # healthy. If this times out the play stops (any_errors_fatal).
        - name: Wait for all containers to be running and healthy
          ansible.builtin.shell: "{{ docker_bin | default('docker') }} ps --format '{% raw %}{{.Names}}|{{.Status}}{% endraw %}'"
          register: docker_state
          until: >-
            docker_state.rc == 0 and
            (docker_state.stdout_lines
              | select('search', 'unhealthy|Restarting|health: starting')
              | list | length) == 0
          retries: "{{ health_retries }}"
          delay: "{{ health_delay }}"
          changed_when: false
          when: docker_present.stat.exists

        - name: Discord - back online
          community.general.discord:
            webhook_id: "{{ discord_webhook_id }}"
            webhook_token: "{{ discord_webhook_token }}"
            content: "[{{ inventory_hostname }}] is back online and healthy."
            username: Ansible
            avatar_url: "https://pantheon.tech/wp-content/uploads/2019/04/ansible.png"
          delegate_to: localhost
          become: false
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ignore_errors: true

# -----------------------------------------------------------------------------
# 4. Scheduled reboot - hosts Semaphore depends on (scheduled_reboot_minutes set)
#    Set in host_vars: docker-ceph (Semaphore's DB) = 2, cyborg (Semaphore) = 10.
#    The DB host reboots first so the database is back before Semaphore restarts.
# -----------------------------------------------------------------------------
- name: "4/4 Schedule reboots for the Semaphore host and its database host"
  hosts: "{{ scriptinventory }}"
  become: true
  gather_facts: false

  vars:
    discord_webhook_id: "1149362209001054268"

  tasks:
    - name: Skip hosts without a scheduled reboot
      ansible.builtin.meta: end_host
      when: scheduled_reboot_minutes is not defined

    - name: Check reboot status
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false
      register: reboot_required

    - name: Discord - scheduled reboot
      community.general.discord:
        webhook_id: "{{ discord_webhook_id }}"
        webhook_token: "{{ discord_webhook_token }}"
        content: "[{{ inventory_hostname }}] needs a reboot. It will reboot in {{ scheduled_reboot_minutes }} minute(s), after this run finishes."
        username: Ansible
        avatar_url: "https://pantheon.tech/wp-content/uploads/2019/04/ansible.png"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      ignore_errors: true
      when: reboot_required.stat.exists

    - name: Schedule reboot (returns immediately so the Semaphore run can finish)
      ansible.builtin.command:
        argv:
          - shutdown
          - -r
          - "+{{ scheduled_reboot_minutes }}"
          - "Ansible: scheduled reboot after package updates"
      changed_when: true
      when: reboot_required.stat.exists
