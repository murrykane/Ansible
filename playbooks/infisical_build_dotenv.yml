- hosts: "{{ scriptinventory }}"

  tasks:

    - name: Show some variables for this host
      ansible.builtin.debug:
        msg:
          - "home_dir: {{ home_dir }}"
          - "infisical_url: {{ infisical_url }}"
          - "Output file: {{ output_file }}"
          #- "infisical_client_id: {{ infisical_client_id }}"
          #- "infisical_client_secret: {{ infisical_client_secret }}"
          #- "homelab_project_id: {{ infisical_project_id }}"

    - name: Check if Infisical CLI is installed
      ansible.builtin.command: "{{ infisical_bin }} --version"
      register: infisical_check
      failed_when: false
      changed_when: false

    - name: Install Infisical CLI repository
      ansible.builtin.shell: |
        curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
      when: infisical_check.rc != 0
      args:
        creates: /etc/apt/sources.list.d/infisical-infisical-cli.list

    - name: Install Infisical CLI
      ansible.builtin.apt:
        name: infisical
        update_cache: true
      become: true
      when: infisical_check.rc != 0

    - name: Authenticate with Infisical and get access token
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} login
          --domain={{ infisical_url }}
          --method=universal-auth
          --client-id={{ infisical_client_id }}
          --client-secret={{ infisical_client_secret }}
          --silent --plain
      register: infisical_token
      no_log: "{{ infisical_log }}"

    ###########################################################################
    # Dockhand API stack lookup
    #
    # Fetch the Dockhand Git-managed stacks once and build a map keyed by
    # stackName.
    #
    # Each map entry contains:
    #
    #   project-name:
    #     id: 35
    #     webhookEnabled: true
    #     webhookSecret: "secret"
    #
    # The webhook secret is intentionally kept out of debug output.
    ###########################################################################

    - name: Fetch Dockhand git stacks for lookup
      ansible.builtin.uri:
        url: "{{ dockhand_api_url }}/api/git/stacks"
        method: GET
        headers:
          Authorization: "Bearer {{ dockhand_api_token }}"
        return_content: true
        status_code: 200
      register: dockhand_git_stacks_raw
      no_log: "{{ infisical_log }}"
      when: dockhand_writer | default(false)

    - name: Build project-name to Dockhand stack details map
      ansible.builtin.set_fact:
        dockhand_stack_map: >-
          {{
            dockhand_stack_map | default({}) | combine({
              item.stackName: {
                'id': item.id,
                'webhookEnabled': item.webhookEnabled | default(false),
                'webhookSecret': item.webhookSecret | default('')
              }
            })
          }}
      loop: "{{ dockhand_git_stacks_raw.json }}"
      loop_control:
        label: "{{ item.stackName }}"
      no_log: "{{ infisical_log }}"
      when: dockhand_writer | default(false)

    ###########################################################################
    # End Dockhand API stack lookup
    ###########################################################################

    - name: Ensure project directories exist
      ansible.builtin.file:
        path: "{{ home_dir }}/{{ item.project }}"
        state: directory
        owner: "{{ infisical_owner }}"
        group: "{{ infisical_group }}"
        mode: "0750"
      loop: "{{ infisical_containers }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Export secrets from Infisical
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} export
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path={{ item.path }}
          --format=dotenv
      register: project_env
      no_log: "{{ infisical_log }}"
      loop: "{{ infisical_containers }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Write rendered {{ output_file }} files
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ home_dir }}/{{ item.item.project }}/{{ output_file }}"
        mode: "0440"
        owner: "{{ infisical_owner }}"
        group: "{{ infisical_group }}"
      loop: "{{ project_env.results }}"
      loop_control:
        label: "{{ item.item.project }}"
      register: env_write_results
      no_log: "{{ infisical_log }}"

    ###########################################################################
    # Dockhand-managed Git stacks
    #
    # .env changes are deployed by Dockhand through its Git stack webhook.
    # Self-managed Dockhand stacks are excluded and handled later using local
    # docker compose.
    ###########################################################################

    - name: Trigger Dockhand webhook for changed Git stacks
      ansible.builtin.uri:
        url: >-
          {{ dockhand_api_url }}/api/git/stacks/{{
            dockhand_stack_map[item.item.item.project].id
          }}/webhook
        method: POST
        headers:
          X-Gitlab-Token: >-
            {{ dockhand_stack_map[item.item.item.project].webhookSecret }}
          Content-Type: "application/json"
        body: "{}"
        body_format: raw
        status_code: 200
        return_content: true
      loop: "{{ env_write_results.results }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      register: dockhand_webhook_results
      no_log: true
      when:
        - item.changed
        - item.item.item.project not in (
            dockhand_selfmanaged_containers
            | default([])
            | map(attribute='project')
            | list
          )
        - item.item.item.project in (dockhand_stack_map | default({}))
        - dockhand_stack_map[item.item.item.project].webhookEnabled | bool
        - dockhand_stack_map[item.item.item.project].webhookSecret | length > 0

    - name: Warn about changed projects with no matching Dockhand stack
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ item.item.item.project }} .env changed but no matching
          Dockhand git stack was found by name — secret NOT applied via
          Dockhand webhook. Check the stack's name in Dockhand vs this
          project's name.
      loop: "{{ env_write_results.results }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - item.changed
        - item.item.item.project not in (
            dockhand_selfmanaged_containers
            | default([])
            | map(attribute='project')
            | list
          )
        - item.item.item.project not in (dockhand_stack_map | default({}))

    - name: Warn about changed projects with webhook disabled
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ item.item.item.project }} .env changed and the matching
          Dockhand stack exists, but its webhookEnabled value is false.
          Dockhand webhook was NOT called.
      loop: "{{ env_write_results.results }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - item.changed
        - item.item.item.project not in (
            dockhand_selfmanaged_containers
            | default([])
            | map(attribute='project')
            | list
          )
        - item.item.item.project in (dockhand_stack_map | default({}))
        - not (dockhand_stack_map[item.item.item.project].webhookEnabled | bool)

    - name: Warn about changed projects with no Dockhand webhook secret
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ item.item.item.project }} .env changed and the matching
          Dockhand stack has webhookEnabled=true, but webhookSecret is empty.
          Dockhand webhook was NOT called.
      loop: "{{ env_write_results.results }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - item.changed
        - item.item.item.project not in (
            dockhand_selfmanaged_containers
            | default([])
            | map(attribute='project')
            | list
          )
        - item.item.item.project in (dockhand_stack_map | default({}))
        - dockhand_stack_map[item.item.item.project].webhookEnabled | bool
        - dockhand_stack_map[item.item.item.project].webhookSecret | length == 0

    - name: Show summary
      ansible.builtin.debug:
        msg: >-
          Wrote {{ output_file }} files for:
          {{ infisical_containers | map(attribute='project') | list }}

    ###########################################################################
    # Dockhand secret builds
    #
    # dockhand_home_dir is the single canonical .env location for
    # Dockhand-managed stacks.
    ###########################################################################

    - name: Restrict dockhand_containers to projects this host actually owns
      ansible.builtin.set_fact:
        dockhand_host_containers: >-
          {{
            dockhand_containers
            | selectattr(
                'project',
                'in',
                (
                  hostvars[inventory_hostname].infisical_containers
                  | default([])
                  | map(attribute='project')
                  | list
                )
              )
            | list
          }}
      when: dockhand_writer | default(false)

    - name: Ensure dockhand project directories exist
      ansible.builtin.file:
        path: "{{ dockhand_home_dir }}/{{ item.project }}"
        state: directory
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
        mode: "0750"
      loop: "{{ dockhand_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0
        - inventory_hostname not in ['kaneserver.kane.mk', 'murdognas.kane.mk']

    - name: Export secrets from Infisical for dockhand stacks
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} export
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path={{ item.path }}
          --format=dotenv
      register: dockhand_env
      no_log: "{{ infisical_log }}"
      loop: "{{ dockhand_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0
        - inventory_hostname not in ['kaneserver.kane.mk', 'murdognas.kane.mk']

    - name: Write rendered {{ output_file }} files for dockhand stacks
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ dockhand_home_dir }}/{{ item.item.project }}/{{ output_file }}"
        mode: "0440"
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
      loop: "{{ dockhand_env.results | default([]) }}"
      loop_control:
        label: "{{ item.item.project }}"
      register: dockhand_env_write_results
      no_log: "{{ infisical_log }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0
        - inventory_hostname not in ['kaneserver.kane.mk', 'murdognas.kane.mk']

    # No recycle task here on purpose:
    # this is a second backup copy of the same project .env files.
    # The primary block above handles the Dockhand webhook/recycle.

    - name: Show summary for dockhand stacks
      ansible.builtin.debug:
        msg: >-
          Wrote {{ output_file }} for dockhand on this host:
          {{ dockhand_host_containers | default([]) | map(attribute='project') | list }}
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0
        - inventory_hostname not in ['kaneserver.kane.mk', 'murdognas.kane.mk']

    ###########################################################################
    # Self-managed Dockhand stacks
    #
    # These stacks are not Git-managed by Dockhand and therefore continue to
    # use local docker compose.
    ###########################################################################

    - name: Restrict self-managed stacks to the ones this host owns
      ansible.builtin.set_fact:
        dockhand_selfmanaged_host_containers: >-
          {{
            dockhand_selfmanaged_containers | default([])
            | selectattr('host', 'equalto', inventory_hostname)
            | list
          }}
      when: dockhand_writer | default(false)

    - name: Ensure self-managed dockhand project directories exist
      ansible.builtin.file:
        path: "{{ dockhand_repo_home_dir }}/{{ item.project }}"
        state: directory
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
        mode: "0750"
      loop: "{{ dockhand_selfmanaged_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0

    - name: Export secrets from Infisical for self-managed dockhand stacks
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} export
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path={{ item.path }}
          --format=dotenv
      register: dockhand_selfmanaged_env
      no_log: "{{ infisical_log }}"
      loop: "{{ dockhand_selfmanaged_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0

    - name: Write rendered {{ output_file }} for self-managed dockhand stacks
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ dockhand_repo_home_dir }}/{{ item.item.project }}/{{ output_file }}"
        mode: "0440"
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
      loop: "{{ dockhand_selfmanaged_env.results | default([]) }}"
      loop_control:
        label: "{{ item.item.project }}"
      register: dockhand_selfmanaged_write_results
      no_log: "{{ infisical_log }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0

    # docker compose up -d only.
    # No down first because that creates an unnecessary outage risk.

    - name: Recycle self-managed dockhand stacks for changed projects only
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ dockhand_repo_home_dir }}/{{ item.item.item.project }}"
      loop: "{{ dockhand_selfmanaged_write_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0
        - item.changed

    - name: Show docker changes found for changed self-managed dockhand projects only
      ansible.builtin.debug:
        msg: >-
          Docker Recycle Needed for Self-Managed Dockhand Stack:
          {{ dockhand_repo_home_dir }}/{{ item.item.item.project }}
      loop: "{{ dockhand_selfmanaged_write_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0
        - item.changed

    - name: Show summary for self-managed dockhand stacks
      ansible.builtin.debug:
        msg: >-
          Wrote {{ output_file }} for self-managed dockhand stacks on this host:
          {{ dockhand_selfmanaged_host_containers | default([]) | map(attribute='project') | list }}
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0

    ###########################################################################
    # Shared Cloudflare API token
    ###########################################################################

    - name: Fetch shared Cloudflare API token
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} secrets get CF_DNS_API_TOKEN
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path=/traefik
          --plain --silent
      register: cf_token
      no_log: "{{ infisical_log }}"
      loop: "{{ infisical_containers | selectattr('project', 'match', '^traefik') | list }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Write cf-token file for each traefik instance
      ansible.builtin.copy:
        content: "{{ item.stdout | trim }}"
        dest: "{{ home_dir }}/{{ item.item.project }}/cf-token"
        mode: "0440"
        owner: "{{ infisical_owner }}"
        group: "{{ infisical_group }}"
      loop: "{{ cf_token.results }}"
      loop_control:
        label: "{{ item.item.project }}"
      no_log: "{{ infisical_log }}"

