- hosts: "{{ scriptinventory }}"

  tasks:

    - name: Show some variables for this host
      ansible.builtin.debug:
        msg:
          - "home_dir: {{ home_dir }}"
          - "infisical_url: {{ infisical_url }}"
          - "Output file: {{ output_file }}"
          #- "infisical_client_id: {{ infisical_client_id }}"
          #- "infisical_client_secret: {{ infisical_client_secret }}"
          #- "homelab_project_id: {{ infisical_project_id }}"

    - name: Check if Infisical CLI is installed
      ansible.builtin.command: "{{ infisical_bin }} --version"
      register: infisical_check
      failed_when: false
      changed_when: false

    - name: Install Infisical CLI repository
      ansible.builtin.shell: |
        curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
      when: infisical_check.rc != 0
      args:
        creates: /etc/apt/sources.list.d/infisical-infisical-cli.list

    - name: Install Infisical CLI
      ansible.builtin.apt:
        name: infisical
        update_cache: true
      become: true
      when: infisical_check.rc != 0

    - name: Authenticate with Infisical and get access token
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} login
          --domain={{ infisical_url }}
          --method=universal-auth
          --client-id={{ infisical_client_id }}
          --client-secret={{ infisical_client_secret }}
          --silent --plain
      register: infisical_token
      no_log: "{{ infisical_log }}"

    #### added: Dockhand API stack ID lookup, used to recycle git-managed
    #### stacks via Dockhand itself rather than a local `docker compose`
    #### shell command. Requires dockhand_api_url and dockhand_api_token
    #### in your vars file. ASSUMPTION TO VERIFY against your installed
    #### Dockhand version's own API docs before relying on this: the list
    #### endpoint path (/api/git/stacks) and that each returned object has
    #### "name" and "id" fields — adjust the two tasks below if your
    #### version's response shape differs.
    - name: Fetch Dockhand git stacks for ID lookup
      ansible.builtin.uri:
        url: "{{ dockhand_api_url }}/api/git/stacks"
        method: GET
        headers:
          Authorization: "Bearer {{ dockhand_api_token }}"
        return_content: true
        status_code: 200
      register: dockhand_git_stacks_raw
      no_log: "{{ infisical_log }}"
      when: dockhand_writer | default(false)

    - name: Build project-name to Dockhand stack ID map
      ansible.builtin.set_fact:
        dockhand_stack_id_map: >-
          {{
            dict(
              dockhand_git_stacks_raw.json | map(attribute='name') | list
              | zip(dockhand_git_stacks_raw.json | map(attribute='id') | list)
            )
          }}
      when: dockhand_writer | default(false)
    #### end Dockhand API stack ID lookup

    - name: Ensure project directories exist
      ansible.builtin.file:
        path: "{{ home_dir }}/{{ item.project }}"
        state: directory
        owner: "{{ infisical_owner }}"
        group: "{{ infisical_group }}"
        mode: "0750"
      loop: "{{ infisical_containers }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Export secrets from Infisical
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} export
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path={{ item.path }}
          --format=dotenv
      register: project_env
      no_log: "{{ infisical_log }}"
      loop: "{{ infisical_containers }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Write rendered {{ output_file }} files
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ home_dir }}/{{ item.item.project }}/{{ output_file }}"
        mode: "0440"
        owner: "{{ infisical_owner }}"
        group: "{{ infisical_group }}"
      loop: "{{ project_env.results }}"
      loop_control:
        label: "{{ item.item.project }}"
      register: env_write_results
      no_log: "{{ infisical_log }}"

    #### .env here is now a backup copy only — Dockhand's own Infisical
    #### secret provider resolves ${VARS} into the compose YAML at deploy
    #### time. Recycling therefore means telling Dockhand to redeploy via
    #### its API, not running `docker compose` locally. The two stacks
    #### that still can't be Git-managed (dockhand_selfmanaged_containers,
    #### below) are excluded here and keep their own local-CLI recycle.
    - name: Recycle changed projects via Dockhand API
      ansible.builtin.uri:
        url: "{{ dockhand_api_url }}/api/git/stacks/{{ dockhand_stack_id_map[item.item.item.project] }}/sync"
        method: POST
        headers:
          Authorization: "Bearer {{ dockhand_api_token }}"
        body_format: json
        # forceRedeploy guarantees the redeploy happens even though the
        # compose file in git hasn't changed — only the Infisical secret
        # value has. VERIFY this field name against your Dockhand
        # version's API docs; it has changed names across releases
        # (forceRedeploy / forceRecreate).
        body:
          forceRedeploy: true
        status_code: 200
        return_content: true
      loop: "{{ env_write_results.results }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      register: dockhand_api_recycle_results
      when:
        - item.changed
        - item.item.item.project not in (dockhand_selfmanaged_containers | default([]) | map(attribute='project') | list)
        - item.item.item.project in dockhand_stack_id_map

    - name: Warn about changed projects with no matching Dockhand stack
      ansible.builtin.debug:
        msg: "WARNING: {{ item.item.item.project }} .env changed but no matching Dockhand git stack was found by name — secret NOT applied via API. Check the stack's name in Dockhand vs this project's name."
      loop: "{{ env_write_results.results }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - item.changed
        - item.item.item.project not in (dockhand_selfmanaged_containers | default([]) | map(attribute='project') | list)
        - item.item.item.project not in dockhand_stack_id_map

    - name: Show summary
      ansible.builtin.debug:
        msg: "Wrote {{ output_file }} files for: {{ infisical_containers | map(attribute='project') | list }}"

    #### added for dockhand secret builds.....
    # dockhand_home_dir is the single canonical .env location for
    # dockhand-managed stacks — the live path the Docker daemon actually
    # reads at deploy time regardless of which host Dockhand schedules the
    # container onto. No copy is written under /opt/repos/kaneworld for
    # these projects: push_repos.yml's repo sync must never be in a
    # position to touch or re-date a secret file, so there is nothing there
    # for it to find.
    #
    # dockhand_containers is a FLEET-WIDE union (every host's
    # infisical_containers, summed) and carries no host-ownership info by
    # itself. Every task below must operate only on the subset this
    # specific host actually owns — reusing the same infisical_containers
    # membership the plain (non-dockhand) write block above already relies
    # on — or every host in scriptinventory will loop the entire fleet and
    # attempt `docker compose up -d` locally for projects it doesn't own.
    # That happened once already (see incident note); do not remove this
    # filter.
    - name: Restrict dockhand_containers to projects this host actually owns
      ansible.builtin.set_fact:
        dockhand_host_containers: >-
          {{
            dockhand_containers
            | selectattr('project', 'in', (hostvars[inventory_hostname].infisical_containers | default([]) | map(attribute='project') | list))
            | list
          }}
      when: dockhand_writer | default(false)

    - name: Ensure dockhand project directories exist
      ansible.builtin.file:
        path: "{{ dockhand_home_dir }}/{{ item.project }}"
        state: directory
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
        mode: "0750"
      loop: "{{ dockhand_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0

    - name: Export secrets from Infisical for dockhand stacks
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} export
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path={{ item.path }}
          --format=dotenv
      register: dockhand_env
      no_log: "{{ infisical_log }}"
      loop: "{{ dockhand_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0

    - name: Write rendered {{ output_file }} files for dockhand stacks
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ dockhand_home_dir }}/{{ item.item.project }}/{{ output_file }}"
        mode: "0440"
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
      loop: "{{ dockhand_env.results | default([]) }}"
      loop_control:
        label: "{{ item.item.project }}"
      register: dockhand_env_write_results
      no_log: "{{ infisical_log }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0

    # No recycle task here on purpose: this write is a second backup copy
    # (kept under /opt/repos/kaneworld rather than home_dir) of the same
    # projects the primary block above already recycles via the Dockhand
    # API. Recycling here too would just double up the same API call.

    - name: Show summary for dockhand stacks
      ansible.builtin.debug:
        msg: "Wrote {{ output_file }} files for dockhand on this host: {{ dockhand_host_containers | default([]) | map(attribute='project') | list }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_host_containers | default([]) | length > 0
    # end added for dockhand secret builds.....

    #### added: self-managed dockhand stacks — dockhand-prod-1 and
    #### postgres-prod-1 — whose live .env/compose sit directly on their
    #### own host rather than being Git+Infisical-managed in Dockhand
    #### (chicken-and-egg problem: each needs its own DB/tool already
    #### running for Dockhand to be able to manage it via Git at all).
    #### These are the ONLY two stacks recycled by local `docker compose`
    #### rather than the Dockhand API. Each entry now carries its own
    #### `host:` so this one block covers any host, not just cyborg —
    #### `dockhand_selfmanaged_containers` in your vars needs a `host:`
    #### field added per entry, e.g.:
    ####   dockhand_selfmanaged_containers:
    ####     - project: dockhand-prod-1
    ####       path: /dockhand-prod-1
    ####       env: prod
    ####       host: cyborg.kane.mk
    ####     - project: postgres-prod-1
    ####       path: /postgres-prod-1
    ####       env: prod
    ####       host: docker-ceph.kane.mk
    #### `dockhand_manage_host` is no longer used by this block and can be
    #### removed from vars.
    - name: Restrict self-managed stacks to the ones this host owns
      ansible.builtin.set_fact:
        dockhand_selfmanaged_host_containers: >-
          {{
            dockhand_selfmanaged_containers | default([])
            | selectattr('host', 'equalto', inventory_hostname)
            | list
          }}
      when: dockhand_writer | default(false)

    - name: Ensure self-managed dockhand project directories exist
      ansible.builtin.file:
        path: "{{ dockhand_repo_home_dir }}/{{ item.project }}"
        state: directory
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
        mode: "0750"
      loop: "{{ dockhand_selfmanaged_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0

    - name: Export secrets from Infisical for self-managed dockhand stacks
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} export
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path={{ item.path }}
          --format=dotenv
      register: dockhand_selfmanaged_env
      no_log: "{{ infisical_log }}"
      loop: "{{ dockhand_selfmanaged_host_containers | default([]) }}"
      loop_control:
        label: "{{ item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0

    - name: Write rendered {{ output_file }} for self-managed dockhand stacks
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ dockhand_repo_home_dir }}/{{ item.item.project }}/{{ output_file }}"
        mode: "0440"
        owner: "{{ dockhand_owner }}"
        group: "{{ dockhand_group }}"
      loop: "{{ dockhand_selfmanaged_env.results | default([]) }}"
      loop_control:
        label: "{{ item.item.project }}"
      register: dockhand_selfmanaged_write_results
      no_log: "{{ infisical_log }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0

    # `docker compose up -d` only — no `down` first. Compose recreates just
    # the containers whose config actually changed in place; a prior
    # down-then-up left postgres-prod-1 removed with the recreate failing
    # on a network pool conflict, so the down step is a real outage risk
    # for no benefit here.
    - name: Recycle self-managed dockhand stacks for changed projects only
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ dockhand_repo_home_dir }}/{{ item.item.item.project }}"
      loop: "{{ dockhand_selfmanaged_write_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0
        - item.changed

    - name: Show docker changes found for changed self-managed dockhand projects only
      ansible.builtin.debug:
        msg: "Docker Recycle Needed for Self-Managed Dockhand Stack: {{ dockhand_repo_home_dir }}/{{ item.item.item.project }}"
      loop: "{{ dockhand_selfmanaged_write_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.project }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0
        - item.changed

    - name: Show summary for self-managed dockhand stacks
      ansible.builtin.debug:
        msg: "Wrote {{ output_file }} for self-managed dockhand stacks on this host: {{ dockhand_selfmanaged_host_containers | default([]) | map(attribute='project') | list }}"
      when:
        - dockhand_writer | default(false)
        - dockhand_selfmanaged_host_containers | default([]) | length > 0
    #### end self-managed dockhand stacks

    - name: Fetch shared Cloudflare API token
      ansible.builtin.command:
        cmd: >
          {{ infisical_bin }} secrets get CF_DNS_API_TOKEN
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path=/traefik
          --plain --silent
      register: cf_token
      no_log: "{{ infisical_log }}"
      loop: "{{ infisical_containers | selectattr('project', 'match', '^traefik') | list }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Write cf-token file for each traefik instance
      ansible.builtin.copy:
        content: "{{ item.stdout | trim }}"
        dest: "{{ home_dir }}/{{ item.item.project }}/cf-token"
        mode: "0440"
        owner: "{{ infisical_owner }}"
        group: "{{ infisical_group }}"
      loop: "{{ cf_token.results }}"
      loop_control:
        label: "{{ item.item.project }}"
      no_log: "{{ infisical_log }}"