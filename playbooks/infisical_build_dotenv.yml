- hosts: "{{ scriptinventory }}"

  tasks:

    - name: Show some variables for this host
      ansible.builtin.debug:
        msg:
          - "home_dir: {{ home_dir }}"
          - "infisical_url: {{ infisical_url }}"
          #- "infisical_client_id: {{ infisical_client_id }}"
          #- "infisical_client_secret: {{ infisical_client_secret }}"
          #- "homelab_project_id: {{ infisical_project_id }}"

    - name: Authenticate with Infisical and get access token
      ansible.builtin.command:
        cmd: >
          infisical login
          --domain={{ infisical_url }}
          --method=universal-auth
          --client-id={{ infisical_client_id }}
          --client-secret={{ infisical_client_secret }}
          --silent --plain
      register: infisical_token
      no_log: false

    - name: Ensure project directories exist
      ansible.builtin.file:
        path: "{{ home_dir }}/{{ item.project }}"
        state: directory
        owner: murry
        group: murry
        mode: "0750"
      loop: "{{ infisical_containers }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Export secrets from Infisical
      ansible.builtin.command:
        cmd: >
          infisical export
          --token={{ infisical_token.stdout }}
          --domain={{ infisical_url }}
          --projectId={{ infisical_project_id }}
          --env={{ item.env }}
          --path={{ item.path }}
          --format=dotenv
      register: project_env
      no_log: true
      loop: "{{ infisical_containers }}"
      loop_control:
        label: "{{ item.project }}"

    - name: Write rendered .env
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ home_dir }}/{{ item.item.project }}/.env"
        mode: "0400"
        owner: murry
        group: murry
      loop: "{{ project_env.results }}"
      loop_control:
        label: "{{ item.item.project }}"
      no_log: true

    - name: Show summary
      ansible.builtin.debug:
        msg: "Wrote .env files for: {{ infisical_containers | map(attribute='project') | list }}"

