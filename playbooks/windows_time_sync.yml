---
- name: Force Windows time sync
  #hosts: windows
  hosts: " {{ scriptinventory }}" 
  gather_facts: false

  tasks:
    - name: Ensure W32Time service is running
      ansible.windows.win_service:
        name: w32time
        state: started
        start_mode: auto

    - name: Resync time against configured NTP source
      ansible.windows.win_shell: w32tm /resync /force
      register: resync_result
      changed_when: "'command completed successfully' in resync_result.stdout"
      failed_when: resync_result.rc != 0

    - name: Show resync output
      debug:
        var: resync_result.stdout_lines