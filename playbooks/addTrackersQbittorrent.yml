---
- name: Run AddqBittorrentTrackers.sh script
  #hosts: mkserver.kane.mk
  hosts: kaneserver.kane.mk
  #become: yes  # Use 'yes' if you need to run the script with sudo privileges
  vars:
    script_cmd: "/mnt/user/appdata/scripts/AddqBittorrentTrackers.sh"
    #script_cmd: "/home/murry/scripts/AddqBittorrentTrackers.sh"

  tasks:
    - name: Ensure the script is executable
      ansible.builtin.file:
        path: "{{ script_cmd }}"
        mode: '0755'
    
    - name: Run the script "{{ script_cmd }}" and capture output
      ansible.builtin.shell: 
        cmd: "{{ script_cmd }} -l"
        #cmd: "bash -i -c '{{ script_cmd }} -l'"
      # environment:
      #   PATH: "{{ ansible_env.PATH }}"
      #   HOME: "{{ ansible_env.HOME }}"
      # become: yes
      # become_user: murry
      register: script_output
    
    - name: Display the output of the script
      ansible.builtin.debug:
        var: script_output.stdout