- name: Deploy alloy config fragments
  template:
    src: "{{ item }}"
    dest: "{{ alloy_config_dir }}/{{ item | regex_replace('.j2$', '') }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ alloy_templates }}"
  notify: restart alloy
  when: ansible_facts.system == "Linux"
  
- name: Render config on Windows
  win_template:
    src: windows-metrics.alloy.j2
    dest: C:\ProgramData\alloy\config.alloy
  when: ansible_facts['system'] == "Win32NT"