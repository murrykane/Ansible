
# ==============================
# roles/alloy/tasks/config.yml
# ==============================
- name: Initialize template list
  set_fact:
    alloy_templates: []

- name: Add linux metrics
  set_fact:
    alloy_templates: "{{ alloy_templates + ['linux-metrics.alloy.j2'] }}"
  when: ansible_system == "Linux"

- name: Add docker config
  set_fact:
    alloy_templates: "{{ alloy_templates + ['docker.alloy.j2'] }}"
  when: alloy_has_docker

- name: Add journald logs
  set_fact:
    alloy_templates: "{{ alloy_templates + ['linux-logs.alloy.j2'] }}"
  when: alloy_has_journald

- name: Add syslog config
  set_fact:
    alloy_templates: "{{ alloy_templates + ['linux-syslog.alloy.j2'] }}"
  when: ansible_system == "Linux" and alloy_enable_syslog

- name: Add tcp config
  set_fact:
    alloy_templates: "{{ alloy_templates + ['linux-tcp.alloy.j2'] }}"
  when: ansible_system == "Linux" and alloy_enable_tcp

- name: Add proxmox metrics
  set_fact:
    alloy_templates: "{{ alloy_templates + ['proxmox-metrics.alloy.j2'] }}"
  when: alloy_is_proxmox

- name: Add windows metrics
  set_fact:
    alloy_templates: "{{ alloy_templates + ['windows-metrics.alloy.j2'] }}"
  when: ansible_system == "Win32NT"

- name: Render final alloy config (Linux)
  copy:
    dest: "{{ alloy_config_path }}"
    content: |
      // GENERATED BY ANSIBLE

      logging {
        level = "info"
      }

      {% for tpl in alloy_templates %}
      {% include tpl %}
      {% endfor %}
  notify: restart alloy
  when: ansible_system != "Win32NT"

- name: Render config on Windows
  win_template:
    src: windows-metrics.alloy.j2
    dest: C:\ProgramData\alloy\config.alloy
  when: ansible_system == "Win32NT"