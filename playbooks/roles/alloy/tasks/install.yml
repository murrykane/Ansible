# ==============================
# roles/alloy/tasks/install.yml
# ==============================
- name: Ensure alloy user exists
  user:
    name: "{{ alloy_user }}"
    system: yes
    create_home: no

- name: Add alloy to docker group
  user:
    name: "{{ alloy_user }}"
    groups: docker
    append: yes
  when: alloy_has_docker

- name: Gather service facts
  service_facts:

- name: Define node exporter service names
  set_fact:
    node_exporter_services:
      - node_exporter.service
      - prometheus-node-exporter.service
      - node-exporter.service

- name: Find installed node exporter services
  set_fact:
    found_node_exporters: "{{ node_exporter_services | select('in', ansible_facts.services) | list }}"

- name: Stop node exporter services
  service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ found_node_exporters }}"

- name: Disable node exporter services
  service:
    name: "{{ item }}"
    enabled: no
  loop: "{{ found_node_exporters }}"

- name: Stop node exporter timers
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - prometheus-node-exporter-apt.timer
    - prometheus-node-exporter-nvme.timer
    - prometheus-node-exporter-smartmon.timer
  when: item in ansible_facts.services

