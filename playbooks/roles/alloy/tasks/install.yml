- name: Install Alloy
  ansible.builtin.include_role:
    name: grafana.grafana.alloy
  vars:
    alloy_config: |
      prometheus.scrape "default" {
        targets = [{"__address__" = "localhost:12345"}]
        forward_to = [prometheus.remote_write.default.receiver]
      }
      prometheus.remote_write "default" {
        endpoint {
            url = "http://mkserver.kane.mk:9090/api/v1/write"
        }
      }


- name: Allow for custom log directory source
  ansible.builtin.template:
    src: default_alloy.j2
    #dest: /etc/default/config.alloy
    dest: "{{ alloy_default_conf }}"
    owner: root
    group: root
    mode: '0644'

- name: Config File is set for directory mode and not file mode
  ansible.builtin.lineinfile:
    path: "{{ alloy_base_env }}"
    regexp: '^CONFIG_FILE='
    line: CONFIG_FILE="/opt/alloy"
  notify: Restart alloy

- name: Config File is set for directory mode and not file mode
  ansible.builtin.lineinfile:
    path: "{{ alloy_base_env }}"
    regexp: '^CUSTOM_ARGS='
    line: CUSTOM_ARGS="--server.http.listen-addr=0.0.0.0:12345"
  notify: Restart alloy

- name: Config File is set for directory mode and not file mode
  ansible.builtin.lineinfile:
    path: "{{ alloy_base_env }}"
    regexp: '^RESTART_ON_UPGRADE='
    line: RESTART_ON_UPGRADE=true
  notify: Restart alloy

- name: Replace Config file for Alloy
  ansible.builtin.template:
    src: default_alloy.j2
    #dest: /etc/alloy/config.alloy
    dest: "{{ alloy_config_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart alloy


