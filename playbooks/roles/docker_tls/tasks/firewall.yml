- name: Allow Docker TLS port
  ufw:
    rule: allow
    port: "{{ docker_tls_port }}"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ docker_allowed_subnets }}"

- name: Allow SSH Port for Firewall
  ufw:
    rule: allow
    port: "22"
    proto: tcp
  #   src: "{{ item }}"
  #   direction: in
  # loop: "{{ docker_allowed_subnets }}"

- name: Allow Alloy Port for Firewall
  ufw:
    rule: allow
    port: "12345"
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny