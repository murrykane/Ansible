# -----------------------------
# Check expiration
# -----------------------------
- name: Get cert expiry
  command: openssl x509 -enddate -noout -in server-cert.pem
  args:
    chdir: "{{ docker_tls_dir }}"
  register: cert_expiry
  when: cert_stat.stat.exists
  changed_when: false

- name: Extract expiry string
  set_fact:
    cert_expiry_raw: "{{ cert_expiry.stdout.split('=')[1] }}"
  when: cert_stat.stat.exists

- name: Convert expiry to epoch
  command: date -d "{{ cert_expiry_raw }}" +%s
  register: cert_expiry_epoch
  when: cert_stat.stat.exists
  changed_when: false

- name: Get current epoch
  command: date +%s
  register: current_epoch
  changed_when: false

# - name: Determine if cert expired
#   set_fact:
#     cert_expired: "{{ (cert_expiry_epoch.stdout | int) < (current_epoch.stdout | int) }}"
#   when: cert_stat.stat.exists

- name: Determine if cert expiring soon (30 days)
  set_fact:
    cert_expired: >
      {{ (cert_expiry_epoch.stdout | int) < ((current_epoch.stdout | int) + (30 * 86400)) }}
  when: cert_stat.stat.exists
  
- name: Force regenerate if expired
  set_fact:
    regenerate_certs: true
  when: cert_expired | default(false)

- name: Set default regenerate flag
  set_fact:
    regenerate_certs: "{{ regenerate_certs | default(not cert_stat.stat.exists) }}"

# -----------------------------
# Generate CA
# -----------------------------
- name: Generate CA
  shell: |
    openssl genrsa -out ca-key.pem 4096
    openssl req -new -x509 -days {{ docker_cert_days }} \
      -key ca-key.pem -sha256 \
      -subj "/CN=docker-ca" \
      -out ca.pem
  args:
    chdir: "{{ docker_tls_dir }}"
  when: regenerate_certs

# -----------------------------
# Server cert
# -----------------------------
- name: Create SAN config
  copy:
    dest: "{{ docker_tls_dir }}/server.cnf"
    content: |
      [req]
      distinguished_name=req

      [ext]
      subjectAltName = {{ docker_tls_san | join(',') }}

- name: Generate server cert
  shell: |
    openssl genrsa -out server-key.pem 4096
    openssl req -new -key server-key.pem \
      -subj "/CN={{ docker_tls_host }}" \
      -out server.csr -config server.cnf

    openssl x509 -req -days {{ docker_cert_days }} \
      -in server.csr \
      -CA ca.pem -CAkey ca-key.pem -CAcreateserial \
      -out server-cert.pem \
      -extensions ext -extfile server.cnf
  args:
    chdir: "{{ docker_tls_dir }}"
  when: regenerate_certs

# -----------------------------
# Client cert
# -----------------------------
- name: Generate client cert
  shell: |
    openssl genrsa -out key.pem 4096
    openssl req -subj "/CN=client" -new -key key.pem -out client.csr
    echo "extendedKeyUsage = clientAuth" > client-ext.cnf

    openssl x509 -req -days {{ docker_cert_days }} \
      -in client.csr \
      -CA ca.pem -CAkey ca-key.pem -CAcreateserial \
      -out cert.pem \
      -extfile client-ext.cnf
  args:
    chdir: "{{ docker_tls_dir }}"
  when: regenerate_certs

# -----------------------------
# Copy to user dir
# -----------------------------
- name: Copy client certs
  copy:
    src: "{{ docker_tls_dir }}/{{ item }}"
    dest: "{{ docker_user_cert_dir }}/{{ item }}"
    remote_src: true
    owner: murry
    group: murry
    mode: '0644'
  loop:
    - ca.pem
    - cert.pem
    - key.pem
  notify: restart docker