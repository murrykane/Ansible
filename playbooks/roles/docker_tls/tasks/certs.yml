- name: Create TLS directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ docker_tls_dir }}"
    - "{{ docker_user_cert_dir }}"

# -----------------------------
# Check if cert exists
# -----------------------------
- name: Check if server cert exists
  stat:
    path: "{{ docker_tls_dir }}/server-cert.pem"
  register: cert_stat

