---
- name: "Install Checkmk agent on all hosts"
  #hosts: "{{ my_hosts | d([]) }}"
  hosts: " {{ scriptinventory }}"
  become: true
  # roles:
  #   - checkmk.general.agent
  vars:
    checkmk_version: "2.2.0p8"
    checkmk_edition: "cre"
    checkmk_os: "ubuntu-24.04"
    checkmk_arch: "amd64"
    #checkmk_url: "https://download.checkmk.com/checkmk/${checkmk_version}/${checkmk_edition}_check-mk-${checkmk_version}_${checkmk_os}_${checkmk_arch}.deb"
    checkmk_url: "https://checkmk.local.kaneworld.org/KaneCo/check_mk/agents/check-mk-agent_2.4.0p12-1_all.deb"
    checkmk_deb_file: "/tmp/checkmk-${checkmk_version}.deb"
    checkmk_folder: ubuntu
    checkmk_agent_version: 2.4.0p8
    checkmk_agent_server: checkmk.local.kaneworld.org
    checkmk_agent_registration_server: checkmk.local.kaneworld.org:8005
    checkmk_user: murrykane
    checkmk_pass: i4eKFBOODdZ&KNuS
    checkmk_agent_site: KaneCo
    # not used...
    #checkmk_agent_edition: " {{ checkmk_edition }}"
    #checkmk_agent_server_protocol: https
    #checkmk_agent_add_host: true
    #checkmk_agent_discover: true
    #checkmk_agent_no_log: false
    #checkmk_agent_site: KaneCo
    #checkmk_agent_auto_activate: true
    #checkmk_agent_legacy_mode: false
    #checkmk_agent_force_foreign_changes: true
    #checkmk_agent_disable_port_check: true
  #   checkmk_agent_mode: pull
  #   checkmk_agent_tls: true  # NOTE: Register Agent to enable TLS
  #   checkmk_agent_user: murrykane
  #   checkmk_agent_pass: i4eKFBOODdZ&KNuS
  #   checkmk_agent_host_name: "{{ ansible_hostname }}"  # NOTE: Required to replace FQDN with hostname only
  #   checkmk_agent_ip_address: "{{ ansible_default_ipv4.address }}"   #NOTE: needed IP address for checkmk to work
  # vars_files:
  #   - /vars/checkmk_secrets.yml


  tasks:
    - name: Ensure dependencies are installed
      apt:
        name:
          - wget
          - gdebi-core
        update_cache: yes

    - name: Download Checkmk .deb package
      get_url:
        url: "{{ checkmk_url }}"
        dest: "{{ checkmk_deb_file }}"
        mode: '0644'

    - name: Install Checkmk .deb package
      apt:
        deb: "{{ checkmk_deb_file }}"

    - name: Clean up downloaded .deb file
      file:
        path: "{{ checkmk_deb_file }}"
        state: absent

    - name: Ensure systemd service is enabled
      systemd:
        name: check-mk-agent-async
        enabled: true
        state: started

    # Create a host with IP.
    - name: "Create a host with IP address."
      checkmk.general.host:
        server_url: "https://{{ checkmk_agent_server }}"
        site: "{{ checkmk_agent_site }}"
        automation_user: "{{ checkmk_user }}"
        automation_secret: "{{ checkmk_pass }}"
        name: "{{ ansible_hostname }}"
        # attributes:
        #   alias: "{{ ansible_hostname }}"
        #   ipaddress: "{{ ansible_default_ipv4.address }}"
        folder: "{{ checkmk_folder }}"
        state: "present"


    - name: include vars 
      ansible.builtin.include_vars: vars/checkmk_secrets.yml

    - name: "Start activation on a specific site"
      checkmk.general.activation:
        server_url: "{{ server_url }}"
        site: "{{ site }}"
        automation_user: "{{ automation_user }}"
        automation_secret: "{{ automation_secret }}"
        force_foreign_changes: true
        sites:
          - "{{ site }}"

    - name: "Add newly discovered services, update labels and remove vanished services on host."
      checkmk.general.discovery:
        server_url: "{{ server_url }}"
        site: "{{ site }}"
        automation_user: "{{ automation_user }}"
        automation_secret: "{{ automation_secret }}"
        host_name: "{{ ansible_hostname }}"
        state: "fix_all"

    - name: "Start activation on a specific site"
      checkmk.general.activation:
        server_url: "{{ server_url }}"
        site: "{{ site }}"
        automation_user: "{{ automation_user }}"
        automation_secret: "{{ automation_secret }}"
        force_foreign_changes: true
        sites:
          - "{{ site }}"


    - name: Register Checkmk agent with server
      ansible.builtin.command: >
        cmk-agent-ctl register
        --server "{{ checkmk_agent_registration_server }}"
        --site "{{ site }}"
        --user "{{ automation_user }}"
        --password "{{ automation_secret }}"
        --hostname "{{ ansible_hostname }}"
        --trust-cert
      #become: yes

    - name: "Add newly discovered services, update labels and remove vanished services on host."
      checkmk.general.discovery:
        server_url: "{{ server_url }}"
        site: "{{ site }}"
        automation_user: "{{ automation_user }}"
        automation_secret: "{{ automation_secret }}"
        host_name: "{{ ansible_hostname }}"
        state: "fix_all"

    - name: "Start activation on a specific site"
      checkmk.general.activation:
        server_url: "{{ server_url }}"
        site: "{{ site }}"
        automation_user: "{{ automation_user }}"
        automation_secret: "{{ automation_secret }}"
        force_foreign_changes: true
        sites:
          - "{{ site }}"