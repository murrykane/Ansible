[defaults]
collections_paths = /home/semaphore/.ansible/collections
# Give slow/busy hosts more time to accept an SSH connection (default is 10s).
timeout = 30

[ssh_connection]
# Same as Ansible's default (-C, ControlMaster, ControlPersist) plus keepalives, so a
# dead SSH session (service restart, host reboot, network blip) is detected in about
# a minute instead of hanging the run until the TCP timeout.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
retries = 3
